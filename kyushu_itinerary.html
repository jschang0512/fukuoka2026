<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var t = localStorage.getItem("kyushu-theme");
    if(t !== "dark" && t !== "light"){
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九州行程表｜福岡・北九州・唐津・佐賀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="shared.css">
<style>
  :root{
    /* page-specific extra tokens (base tokens live in shared.css) */
    --rail:#A13D2C;        /* 蘇芳色 suou — deep brick red, train lines */
    --bus:#4C7A4A;         /* 抹茶色 matcha — bus */
    --boat:#2E6B7A;        /* 藍緑 ai-midori — ferry */
    --cable:#C17B4A;       /* 珊瑚色-ish terracotta — cablecar / slopecar */
    --walk:#7A7280;        /* 鼠色 nezumi — on foot */
    --car:#6B4C7A;         /* 江戸紫 edo-murasaki — taxi / rental car */
    --radius:14px;
  }

  /* ---------- Header ---------- */
  header.hero{
    color:var(--ink);
    padding:34px 20px 22px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  #heroBg{
    background:
      radial-gradient(1200px 300px at 10% -20%, rgba(232,122,144,0.16), transparent 60%),
      linear-gradient(180deg, #FFFFFB 0%, #FCF3F5 100%);
  }
  :root[data-theme="dark"] #heroBg{
    background:
      radial-gradient(1200px 300px at 10% -20%, rgba(254,223,225,0.10), transparent 60%),
      linear-gradient(180deg,#1C1C1C 0%, #262223 100%);
  }
  header.hero > *{ position:relative; z-index:1; }
  header.hero::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 18px, transparent 18px 30px);
    opacity:.7;
    z-index:2;
  }
  .eyebrow{
    letter-spacing:.35em;
    font-size:11px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
    font-family:"JetBrains Mono",monospace;
  }
  h1.title{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:clamp(28px,6vw,42px);
    margin:0 0 6px;
    letter-spacing:.04em;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:clamp(9.5px, 3.2vw, 14px);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding:0 4px;
  }
  .header-badges{ margin-top:14px; }
  .header-badges .countdown-wrap.compact{ margin:0; }
  .countdown-wrap.compact{
    display:inline-flex;
    flex-direction:row;
    align-items:center;
    flex-wrap:nowrap;
    white-space:nowrap;
    gap:8px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    margin:14px auto 0;
    box-shadow:0 1px 4px rgba(0,0,0,.06);
    text-align:left;
  }
  .countdown-wrap.compact .countdown-label{
    margin-bottom:0;
    font-size:13px;
    color:var(--ink);
  }
  .countdown-wrap.compact .countdown{ gap:3px; }
  .countdown-wrap.compact .cd-unit{ flex-direction:row; align-items:baseline; gap:2px; min-width:auto; }
  .countdown-wrap.compact .cd-num{ font-size:13px; color:var(--ink); perspective:120px; min-width:1.4em; }
  .countdown-wrap.compact .cd-label{ font-size:9px; color:var(--ink-soft); margin-top:0; }
  .countdown-wrap.compact .cd-sep{ font-size:12px; color:var(--ink-soft); transform:none; }
  .countdown-wrap.compact .cd-done{ font-size:12px; color:var(--accent-text); }
  .countdown-wrap.compact .cd-forex{ font-size:12px; gap:4px; }
  .countdown-wrap.compact .forex-badge{ font-size:12px; gap:4px; }
  .countdown-wrap.compact .cd-forex-eq{ font-size:10px; }
  /* ---------- Day nav ---------- */
  nav.daynav{
    position:sticky; top:0; z-index:20;
    background:var(--card);
    display:flex;
    align-items:center;
    gap:6px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    border-bottom:1px solid var(--line);
    padding:0 8px;
  }
  .daytabs-scroll{
    display:flex;
    justify-content:center;
    overflow-x:auto;
    flex:1;
    min-width:0;
    scrollbar-width:none;
  }
  .daytabs-scroll::-webkit-scrollbar{display:none;}
  .daytab{
    flex:0 0 auto;
    background:transparent;
    border:none;
    color:var(--ink-soft);
    padding:12px 16px 10px;
    cursor:pointer;
    text-align:center;
    border-bottom:3px solid transparent;
    font-family:"Noto Sans TC",sans-serif;
    position:relative;
  }
  .daytab .num{
    display:block;
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    letter-spacing:.1em;
    color:var(--ink-soft);
    opacity:.7;
  }
  .daytab .lbl{
    display:block;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    margin-top:2px;
  }
  .daytab.active{
    color:var(--ink);
    border-bottom-color:var(--accent-text);
  }
  .daytab.active .num{color:var(--accent-text); opacity:1;}
  .daytab:hover{color:var(--ink);}

  .util-bar{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:10px 12px;
  }
  .util-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--card);
    border:1px solid var(--gold);
    color:var(--ink);
    font-family:"Noto Sans TC",sans-serif;
    font-size:13px;
    font-weight:700;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    text-decoration:none;
    transition:background .15s ease, color .15s ease, transform .15s ease;
  }
  .util-btn:hover{ transform:translateY(-1px); box-shadow:0 3px 8px rgba(140,127,176,.25); }
  .util-btn.active{
    background:#7A6B9E;
    color:#FFFFFF;
    border-color:#7A6B9E;
  }

  /* ---------- Legend ---------- */
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
    padding:14px 16px 4px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* ---------- Day page ---------- */
  main{max-width:640px; margin:0 auto; padding:18px 16px 60px;}
  .day-page{display:none;}
  .day-page.active{display:block; animation:fadeIn .4s cubic-bezier(.2,.8,.3,1);}
  @keyframes fadeIn{from{opacity:0; transform:translateY(10px) scale(.995);} to{opacity:1; transform:translateY(0) scale(1);}}

  /* directional slide for next/prev day navigation (swipe or arrow buttons) —
     more obviously tied to the gesture direction than the plain fade above */
  .day-page.active.slide-next{ animation:slideInFromRight .32s cubic-bezier(.2,.8,.3,1); }
  .day-page.active.slide-prev{ animation:slideInFromLeft .32s cubic-bezier(.2,.8,.3,1); }
  @keyframes slideInFromRight{
    from{ opacity:0; transform:translateX(36px); }
    to{ opacity:1; transform:translateX(0); }
  }
  @keyframes slideInFromLeft{
    from{ opacity:0; transform:translateX(-36px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .day-page.exit-next{ animation:slideOutLeft .18s ease forwards; }
  .day-page.exit-prev{ animation:slideOutRight .18s ease forwards; }
  @keyframes slideOutLeft{
    from{ opacity:1; transform:translateX(0); }
    to{ opacity:0; transform:translateX(-28px); }
  }
  @keyframes slideOutRight{
    from{ opacity:1; transform:translateX(0); }
    to{ opacity:0; transform:translateX(28px); }
  }
  .day-page.shake-boundary{ animation:shakeBoundary .35s ease; }
  @keyframes shakeBoundary{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-10px); }
    50%{ transform:translateX(8px); }
    75%{ transform:translateX(-5px); }
  }

  .day-head{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:12px;
    margin:6px 0 18px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
  }
  .day-head .dnum{
    font-family:"Shippori Mincho",serif;
    font-size:34px;
    font-weight:700;
    color:var(--accent-text);
    line-height:1;
  }
  .day-head .dmeta{flex:1; min-width:0;}
  .day-head .ddate{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .day-head .dtitle{
    font-size:19px;
    font-weight:700;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .hotel-info{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    color:#6E5F87;
    margin-top:4px;
  }
  .sun-info{
    flex:0 0 auto;
    font-family:"JetBrains Mono",monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    background:#F5EEF0;
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 12px;
    white-space:nowrap;
    align-self:center;
  }

  /* day route map */
  .daymap-wrap{ margin:0 0 20px; }
  .daymap-label{
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .daymap{
    height:220px;
    border-radius:14px;
    border:1px solid var(--line);
    overflow:hidden;
    box-shadow:0 1px 2px rgba(38,34,32,.06);
    background:#F5EEF0;
    position:relative;
    isolation:isolate;
    z-index:0;
  }
  #quake-map{ height:400px; }
  .daypin{
    width:24px; height:24px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:11px;
    font-family:"JetBrains Mono",monospace;
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1);
    cursor:pointer;
  }
  .daypin:hover{ transform:scale(1.25); }
  .dayarrow{
    width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    line-height:1;
    text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    pointer-events:none;
  }
  .day-popup{ font-family:"Noto Sans TC",sans-serif; font-size:12.5px; font-weight:600; color:var(--ink); }

  /* timeline */
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{
    content:"";
    position:absolute; left:9px; top:6px; bottom:6px; width:2px;
    background:var(--line);
  }
  .row{position:relative; margin-bottom:16px;}
  .row .dot{
    position:absolute; left:-26px; top:5px;
    width:11px; height:11px; border-radius:50%;
    border:2px solid var(--card);
    box-shadow:0 0 0 1.5px var(--line);
    background:var(--accent);
  }

  /* transit — a slim connector between activities, not a peer-level card */
  .row.row-transit{ margin-bottom:8px; counter-increment:transitleg; }
  .row.row-transit .dot{
    width:16px; height:16px;
    left:-28.5px; top:2px;
    background:var(--card);
    border:2px solid var(--line);
    box-shadow:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .row.row-transit .dot::after{
    content:counter(transitleg);
    font-family:"JetBrains Mono",monospace;
    font-size:8.5px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .transit{
    background:none;
    border:none;
    border-radius:0;
    padding:2px 0;
    box-shadow:none;
    margin-left:2px;
  }
  .transit .leg{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:8px;
    font-size:12.5px;
  }
  .transit .stop{font-weight:600; min-width:0; color:var(--ink-soft);}
  .stop-link{
    color:inherit;
    text-decoration:none;
    border-bottom:1px dotted var(--line);
  }
  .stop-link:hover, .stop-link:active{
    color:var(--accent-text);
    border-bottom-color:var(--accent-text);
  }
  .transit .stop.right{text-align:right;}
  .transit .time{font-family:"JetBrains Mono",monospace; color:var(--ink-soft); font-size:11.5px;}
  .transit .mid{
    position:relative;
    width:48px;
    height:16px;
    flex:0 0 auto;
    overflow:hidden;
  }
  .transit .mid::before{
    content:"";
    position:absolute;
    top:50%; left:0; right:0;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px);
  }
  .transit .mid-icon{
    position:absolute;
    top:50%; left:-14px;
    transform:translateY(-50%);
    font-size:12px;
    animation:midTravel 2.6s linear infinite;
  }
  @keyframes midTravel{
    0%{ left:-14px; opacity:0; }
    12%{ opacity:1; }
    88%{ opacity:1; }
    100%{ left:100%; opacity:0; }
  }
  .transit .meta{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:5px;
  }
  .chip{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
    background:#F5EEF0;
    color:var(--ink-soft);
    border:1px solid var(--line);
  }
  .chip.price{color:#6E5F87; border-color:#E0D0E5; background:#F5EFF7;}
  .chip.transfer{color:var(--accent-text); border-color:#f0c9bf; background:#FBEDE9;}
  .line-tag{
    font-size:12px; font-weight:700;
  }

  /* activity card */
  .activity{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:var(--radius);
    padding:12px 14px;
    box-shadow:0 2px 6px rgba(36,32,36,.08), 0 1px 2px rgba(36,32,36,.05);
  }
  .activity.clickable{ cursor:pointer; }
  .activity-head{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .activity .num{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:16px;
    color:var(--accent-text);
    width:20px;
    flex:0 0 auto;
  }
  .activity .ic{font-size:18px; flex:0 0 auto;}
  .activity .txt{font-size:14.5px; font-weight:500; line-height:1.5; flex:1;}
  .activity .txt .time{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-left:6px;
  }
  .chevron{
    flex:0 0 auto;
    color:var(--ink-soft);
    font-size:13px;
    margin-left:4px;
    transition:transform .2s ease;
  }
  .activity.open .chevron{ transform:rotate(180deg); }
  .activity-detail{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .25s ease, opacity .2s ease, margin-top .25s ease;
  }
  .activity.open .activity-detail{
    max-height:640px;
    opacity:1;
    margin-top:10px;
  }
  .activity-detail p{
    margin:0 0 6px;
    font-size:13px;
    line-height:1.6;
    color:var(--ink-soft);
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .activity-detail p.tip{
    color:var(--ink);
    border-top:none;
    padding-top:0;
    margin-bottom:0;
  }
  .activity-detail p.tip::before{
    content:"💡 ";
  }
  .activity-detail p.souvenir{
    color:#6E5F87;
    border-top:1px dashed var(--line);
    margin-top:6px;
    margin-bottom:0;
  }
  .maplink{
    display:inline-flex;
    align-items:center;
    gap:3px;
    margin-left:8px;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    font-weight:600;
    color:var(--accent-text);
    background:#FBEDE9;
    border:1px solid #F0C9BF;
    border-radius:999px;
    padding:2px 9px;
    text-decoration:none;
    vertical-align:middle;
  }
  .maplink:hover{background:#F5DDD5;}

  /* note / info card */
  .note{
    background:#F5EFF7;
    border:1px dashed #D8C5E8;
    border-radius:var(--radius);
    padding:10px 14px;
    font-size:13px;
    color:#5A4A70;
  }
  .note b{color:#3D3050;}

  .section-label{
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;
    letter-spacing:.15em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:22px 0 8px 0;
    counter-reset:transitleg;
  }
  .row:first-child .section-label{margin-top:0;}

  @media(max-width:480px){
    .transit .leg{font-size:12.5px;}

    /* sun-info was competing with the title for width, causing the
       title to wrap — give it its own full-width row instead */
    /* sun-info used to force the title onto its own wrapped line on
       narrow screens — now it just shrinks a bit and stays on the same
       row, since both the title (ellipsis) and the sun-info text
       (shortened, no wrap) can now share the space cleanly */
    .sun-info{ font-size:10px; padding:4px 9px; }
    .day-head{ flex-wrap:nowrap; }

    header.hero{ padding:26px 16px 18px; }
    .countdown-wrap.compact{ padding:5px 12px; }
  }

  /* ---------- Bottom mobile nav ---------- */
  .bottom-nav{
    display:none; /* shown only on mobile, see media query below */
    position:fixed;
    left:14px; right:14px; bottom:18px;
    z-index:60;
    height:62px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    box-shadow:0 16px 40px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.2), 0 0 0 1px rgba(255,255,255,.04);
    align-items:stretch;
    overflow:hidden;
  }

  /* mobile gets a thumb-reachable bottom nav instead of the top tab
     strip + feature row, which was making the header very tall. This
     breakpoint is deliberately wider than the one above so it reliably
     catches real phone widths (many run 480–700px in browser devtools /
     landscape / larger phones) rather than just very narrow screens. */
  @media(max-width:700px){
    nav.daynav, .util-bar{ display:none; }
    .bottom-nav{ display:flex; }
    body{ padding-bottom:92px; }
    .app-toast{ bottom:96px; }
  }
  .bn-btn{
    flex:0 0 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    background:none;
    border:none;
    color:var(--ink);
    font-size:11px;
    cursor:pointer;
  }
  .bn-btn .bn-icon{
    font-size:16px;
    font-weight:700;
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:var(--paper);
  }
  .bn-btn:active{ background:var(--paper); }
  .bn-btn:disabled{ opacity:.3; }
  .bn-current{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    color:var(--ink);
    cursor:pointer;
    min-width:0;
    padding:0 8px;
  }
  .bn-current-num{
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    color:var(--accent-text);
    font-weight:700;
  }
  .bn-current-theme{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
  }

  .more-sheet{
    display:none;
    position:fixed;
    inset:0;
    z-index:70;
  }
  .more-sheet.open{ display:block; }
  .more-sheet-backdrop{
    position:absolute;
    inset:0;
    background:rgba(15,20,30,.55);
    backdrop-filter:blur(2px);
  }
  .more-sheet-panel{
    position:absolute;
    left:0; right:0; bottom:0;
    max-height:78vh;
    overflow-y:auto;
    background:var(--card);
    border-radius:24px 24px 0 0;
    padding:10px 20px 32px;
    box-shadow:0 -12px 32px rgba(0,0,0,.25);
  }
  .more-sheet-handle{
    width:64px; height:22px;
    margin:2px auto 0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    touch-action:none;
  }
  .more-sheet-handle::after{
    content:"";
    width:40px; height:4px;
    background:var(--line);
    border-radius:999px;
  }
  .more-sheet-handle:active{ cursor:grabbing; }
  .more-sheet-head{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    margin:2px 0 14px;
  }
  .more-sheet-close{

    50%{ opacity:1; filter:brightness(1); }

    gap:10px;
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .flight-date{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
  }
  .flight-note{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    color:var(--accent-text);
    background:#FBEDE9;
    border:1px solid #f0c9bf;
    border-radius:999px;
    padding:2px 9px;
  }
  .flight-item{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .flight-item-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .flight-no{
    font-family:"JetBrains Mono",monospace;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    flex:0 0 auto;
    min-width:64px;
  }
  .flight-airline{ font-size:12.5px; color:var(--ink-soft); flex:1; }
  .flight-pax{
    font-family:"JetBrains Mono",monospace;
    font-size:13px;
    font-weight:700;
    color:var(--accent-text);
    flex:0 0 auto;
  }
  .flight-route{
    display:flex;
    align-items:center;
    gap:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .flight-leg{ flex:1; min-width:0; }
  .flight-leg.right{ text-align:right; }
  .flight-time{
    display:inline-block;
    font-family:"JetBrains Mono",monospace;
    font-size:16px;
    font-weight:700;
    color:#FFB627;
    background:#1A1D22;
    padding:2px 8px;
    border-radius:5px;
    text-shadow:0 0 3px rgba(255,182,39,.5);
    letter-spacing:.02em;
  }
  .flight-airport{
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.4;
    margin-top:4px;
  }
  .flight-arrow{
    flex:0 0 auto;
    width:52px;
    height:16px;
    position:relative;
    overflow:hidden;
  }
  .flight-arrow::before{
    content:"";
    position:absolute;
    top:50%; left:0; right:0;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px);
  }
  .flight-arrow .plane{
    position:absolute;
    top:50%; left:-14px;
    transform:translateY(-50%);
    font-size:13px;
    color:var(--accent-text);
    animation:flyAcross 2.8s linear infinite;
  }
  @keyframes flyAcross{
    0%{ left:-14px; opacity:0; }
    12%{ opacity:1; }
    88%{ opacity:1; }
    100%{ left:100%; opacity:0; }
  }
  .flight-time .flight-tz{
    font-family:"Noto Sans TC",sans-serif;
    font-size:10.5px;
    font-weight:400;
    color:#8A9099;
    text-shadow:none;
    margin-left:5px;
  }
  .flight-link{
    display:block;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-size:12px;
    font-weight:700;
    color:var(--accent-text);
    text-decoration:none;
  }
  .flight-link:hover{ text-decoration:underline; }

  /* ---------- Driving info ---------- */
  .drv-block{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .drv-title{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:14.5px;
    color:var(--ink);
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .drv-list{
    margin:0;
    padding-left:1.2em;
  }
  .drv-list li{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.7;
    margin-bottom:4px;
  }
  .drv-list li b{ color:var(--ink); }
  .drv-pdf-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    background:var(--btn-solid);
    color:var(--btn-solid-fg);
    font-size:13px;
    font-weight:700;
    padding:10px 18px;
    border-radius:999px;
    text-decoration:none;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .drv-pdf-btn:hover{ transform:translateY(-1px); box-shadow:0 4px 12px rgba(36,32,36,.2); }
  .drv-pdf-btn:active{ transform:scale(.96); }

  /* ---------- Micro-interactions ---------- */
  .util-btn, .daytab, .cta, .pack-reset, .gate-btn, .addr-copy-mini,
  .fb-icon, .maplink, .pack-link, .flight-link, .contact-phone{
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .util-btn:active, .cta:active, .pack-reset:active, .gate-btn:active,
  .addr-copy-mini:active, .fb-icon:active, .daytab:active{
    transform:scale(.94);
  }
  .maplink:hover, .pack-link:hover{ transform:translateY(-1px); }
  .activity{ transition:box-shadow .2s ease, border-color .2s ease; }
  .activity.clickable:hover{ box-shadow:0 4px 14px rgba(36,32,36,.14), 0 2px 4px rgba(36,32,36,.08); }

  /* ---------- Scroll reveal ---------- */
  .reveal{
    opacity:0;
    transform:translateY(18px);
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.7,.3,1);
  }
  .reveal.revealed{
    opacity:1;
    transform:translateY(0);
  }

  /* ---------- Dark mode overrides ---------- */
  /* most of the page already adapts via var(--ink)/var(--card)/var(--paper)/
     var(--line) in shared.css — these are the spots with a fixed pastel
     hex color that need an explicit dark-mode equivalent */
  :root[data-theme="dark"]{
    /* the transit-mode colors were tuned for text on a light card;
       on a dark card they're too dark to read, so brighten them */
    --rail:#D97862;
    --bus:#82B87E;
    --boat:#5FA8B8;
    --cable:#D9986A;
    --walk:#A8A0B0;
    --car:#A87DBF;
  }
  :root[data-theme="dark"] .bottom-nav{
    border-color:rgba(255,255,255,.14);
    box-shadow:0 16px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
  }
  :root[data-theme="dark"] .more-sheet-day[data-branch="karatsu"] .n{ color:#5FA9D4; }
  :root[data-theme="dark"] .activity,
  :root[data-theme="dark"] .pack-item,
  :root[data-theme="dark"] .contact-row{
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 2px 8px rgba(0,0,0,.35);
  }
  :root[data-theme="dark"] .activity.clickable:hover{
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 4px 14px rgba(0,0,0,.5);
  }
  :root[data-theme="dark"] .daymap{ background:#232323; }
  :root[data-theme="dark"] .sun-info,
  :root[data-theme="dark"] .chip,
  :root[data-theme="dark"] .addr-box,
  :root[data-theme="dark"] .wx-daycol{ background:#2A2A2A; }
  :root[data-theme="dark"] .wx-p-row{ border-top-color:rgba(255,255,255,.08); }
  :root[data-theme="dark"] .chip.price,
  :root[data-theme="dark"] .note,
  :root[data-theme="dark"] .wx-note{
    background:#2E2A32; border-color:#453F4A; color:#D0C2E0;
  }
  :root[data-theme="dark"] .note b{ color:#DCC9EE; }
  :root[data-theme="dark"] .hotel-info,
  :root[data-theme="dark"] .activity-detail p.souvenir{ color:#C9B8E0; }
  :root[data-theme="dark"] .chip.transfer,
  :root[data-theme="dark"] .flight-note{
    background:#3A2420; border-color:#5C332C;
  }
  :root[data-theme="dark"] .maplink{
    background:#3A2420; border-color:#5C332C;
  }
  :root[data-theme="dark"] .maplink:hover{ background:#472C26; }
  :root[data-theme="dark"] .gate-wrap{ border-color:#453F4A; }
  :root[data-theme="dark"] .day-popup,
  :root[data-theme="dark"] .popup-card{ color:#2A2126; } /* leaflet popups keep a light chrome regardless of theme */
</style>
</head>

const INFO = {
  "博多駅": {
    intro:"博多車站是JR九州的心臟地帶，新幹線、在來線跟地下鐵在此交會，同時也是進出福岡最主要的門戶。車站本身就是「JR博多CITY」複合商場，橫向連接博多阪急百貨，地下街更延伸出數百公尺的餐飲跟伴手禮店。剛抵達福岡想找地方寄放行李、順便吃頓像樣的午餐，這裡幾乎不用移動就能一次滿足。",
    tip:"推薦：①一風堂、一蘭等知名豚骨拉麵在博多駅周邊都有分店，方便比較不同流派；②地下街的鐵道便當跟明太子伴手禮專賣店集中好逛，買回程禮很省時間；③博多口外的老牌烏龍麵店「牧のうどん」，湯頭偏甜、麵條軟嫩，是九州系烏龍麵的代表。",

  "博多運河城 キャナルシティ博多": {

    souvenir:"🛍 伴手禮：拉麵競技場出口處常有限定拉麵泡麵組合，館內樓層也找得到福岡限定的Royce巧克力跟通りもん。"

  "福岡 天神": {
    intro:"天神是福岡最核心的商業區，天神地下街跟周邊的岩田屋、大丸百貨串聯起龐大的購物跟餐飲網絡，晚上更是居酒屋、屋台跟酒吧林立的不夜城。這裡也是福岡屋台文化的重要據點，沿著昭和通、渡邊通一帶，傍晚開始就會陸續擺出一整排路邊屋台，是體驗福岡在地夜生活最經典的方式。",
    tip:"推薦：①找一攤路邊屋台吃豚骨拉麵配煎餃，順便跟隔壁的在地人聊聊天；②今泉一帶巷弄裡藏了不少道地居酒屋跟串燒店，適合續攤；③想吃點別的可以到天神地下街覓食，烏龍麵、丼飯、甜點選擇都很多。",
    souvenir:"🛍 伴手禮：岩田屋、大丸百貨地下街的和菓子禮盒，還有超市買得到的辛子明太子真空包，方便帶回國。"

  "新時代 福岡天神店": {
    intro:"新時代是發明「炸雞皮串」的連鎖居酒屋，由前職業足球選手一手打造品牌，主打招牌「傳串」自2010年開賣以來已經累積賣出超過兩億支，是福岡年輕人跟遊客都愛去的宵夜熱點。店內氣氛熱鬧，點餐時服務生會現場把串烤堆疊成金字塔造型上桌，視覺效果十足，很適合三五好友聚餐續攤。",

    souvenir:"🛍 伴手禮：日本國民藥妝、季節限定零食、免稅生活雜貨，這裡本身就是伴手禮採買的最後一站。",
    coupon:"🎟 折價券：稅前滿10,000日圓可折5%，結帳「前」要出示（付款後出示無效，截圖也不能用），酒類、香菸、POSA卡等不適用"

    souvenir:"🛍 伴手禮：新宮町與相島合作推出的珍珠護手霜、貓咪造型小物，還有當地曬乾的わかめ海帶。"

  "小倉駅": {

    souvenir:"🛍 伴手禮：北九州名物蒲鉾（かまぼこ）魚板、資さんうどん的調理包，車站內都買得到。"
  },
  "小倉城": {
    intro:"小倉城是江戶時代由細川氏建造的城堡，之後由小笠原氏接手治理，天守閣採用少見的「唐造り」樣式，頂層比下層更寬，外型獨具特色。城內展示戰國時期到江戶時代的武具、文物，登上天守閣可以360度俯瞰小倉市區跟緊鄰的紫川。",
    tip:"推薦：①天守閣內的歷史文物展示，適合喜歡日本戰國史的人細細參觀；②旁邊的小倉城庭園是仿江戶時代大名庭園打造的迴遊式庭園，可以順道走走；③傍晚時分天守閣打燈後很好拍照，是小倉的地標夜景之一。",
    souvenir:"🛍 伴手禮：城下町周邊的和菓子老鋪，還有以小倉織為主題的布小物、束口袋。"
  },
  "あるあるCity 北九州": {
    intro:"あるあるCity是北九州市打造的動漫、次文化聖地，整棟大樓從地下1樓到7樓幾乎都是動漫周邊、漫畫、模型跟偶像相關商店，5、6樓更設有北九州市漫畫博物館，由《宇宙戰艦大和號》《銀河鐵道999》的作者松本零士擔任榮譽館長。假日經常舉辦聲優跟偶像的見面會、演唱活動，是喜歡日本次文化的人不能錯過的景點。",
    tip:"推薦：①漫畫博物館裡展示松本零士的原畫跟人物模型，粉絲一定要朝聖；②館內的周邊商店（如駿河屋、Animate）可以慢慢挖寶絕版商品；③留意當天有沒有偶像或聲優活動，現場氣氛通常很熱鬧。",
    souvenir:"🛍 伴手禮：動漫周邊、扭蛋、限定徽章，喜歡日本次文化的人可以在這裡血拚一波。"
  },
  "門司港レトロ": {
    intro:"門司港曾是明治到大正時期九州對外貿易的第一大港，舊門司稅關、舊大阪商船大樓、舊門司三井俱樂部等紅磚洋樓建築保存完整，整條海港老街散發濃厚的異國風情，退潮時分坐在關門海峽邊看夕陽，更是遊客公認的浪漫時刻。",
    tip:"推薦：①門司港發源的名物「燒咖哩」（焼きカレー）幾乎每間餐廳都有自己的獨門版本，值得比較；②海港周邊有不少賣海鮮串跟炸物的小吃攤，邊走邊吃很愜意；③傍晚一定要走到親水區看夕陽落入關門海峽，天氣好時能同時看到對岸下關的燈火。",
    souvenir:"🛍 伴手禮：門司港名物焼きカレー調理包，還有呼應這裡曾是香蕉叫賣發源地的蕉葉造型餅乾。"
  },
  "皿倉山展望台": {
    intro:"皿倉山是北九州市郊的知名夜景山，需要先搭無料接駁巴士到山麓，再轉乘纜車跟坡道車才能抵達山頂展望台，整個交通過程本身就充滿樂趣。山頂視野遼闊，可以將北九州工業區跟關門海峽的璀璨燈火盡收眼底，曾被列為日本三大夜景之一。",
    tip:"推薦：①傍晚時段上山可以連續看到夕陽轉夜景兩種截然不同的風景；②展望台旁有販賣輕食跟飲料的小店，可以邊賞夜景邊小憩；③纜車跟坡道車本身也是拍照亮點，天氣晴朗時可以看到很遠的海岸線。",
    souvenir:"🛍 伴手禮：山頂賣店的北九州夜景明信片、瓦せんべい（瓦片造型煎餅）。"
  },
  "東長寺 福岡": {
    intro:"東長寺是平安時代高僧空海（弘法大師）從中國學成歸國後，在博多創建的日本第一座真言宗寺院，擁有超過1200年的歷史。寺內供奉的木造福岡大佛高達約10.8公尺，是日本最大的木造坐佛之一，莊嚴的佛像在博多鬧區中格外顯眼。",
    tip:"推薦：①一定要體驗大佛底下漆黑的「地獄極樂巡り」通道，摸著牆壁在全黑空間裡走一圈，結束後有種重生的感覺；②五重塔是近年新建的建築，色彩鮮豔很好拍照；③境內販售的御守也是熱門的伴手禮選擇。",
    souvenir:"🛍 伴手禮：寺方授予的御守、大佛造型小吊飾。"
  },
  "櫛田神社 福岡": {
    intro:"櫛田神社是博多的總鎮守，已有超過1200年歷史，每年7月舉辦的「博多祇園山笠祭」是日本三大祭典之一，祭典期間男丁們扛著重達一噸的山笠花車在市區狂奔，場面壯觀。就算不是祭典期間，神社境內也長年展示著一座巨大華麗的裝飾山笠，讓遊客感受祭典的氣勢。",
    tip:"推薦：①境內常設的裝飾山笠花車一定要近距離欣賞，細節雕工非常精緻；②被稱為「不老長壽の水」的靈泉井，傳說喝了可以延年益壽；③神社旁的「博多歷史館」可以更深入了解博多的歷史文化。",
    souvenir:"🛍 伴手禮：山笠祭主題御守、印有山笠圖案的博多仙貝。"
  },
  "川端通商店街": {
    intro:"川端通商店街是博多最古老的拱廊型商店街，已有超過100年歷史，昭和懷舊氛圍濃厚，也是每年博多祇園山笠祭巨大山笠花車遊行的必經路線。商店街裡有和菓子老鋪、乾貨行跟傳統服飾店，保留了博多庶民生活的日常樣貌。",
    tip:"推薦：①川端善哉廣場的紅豆年糕湯（ぜんざい）是商店街的招牌甜點，冬天吃特別暖胃；②沿路的乾貨、佃煮老店可以買一些特色伴手禮；③商店街尾端連接著櫛田神社，可以安排順遊。",
    souvenir:"🛍 伴手禮：商店街裡的老鋪佃煮、鹹甜點心，還有博多人形（博多傳統人偶）。"
  },
  "叙々苑 KITTE博多店": {
    intro:"叙々苑是日本高級燒肉連鎖品牌的代表，以嚴選和牛跟講究的待客服務聞名全國。博多店開在緊鄰博多車站的商業設施「KITTE博多」10樓，從博多車站2號出口步行約1分鐘就能抵達，交通非常方便，很適合安排在移動空檔享用一頓豐盛的午餐。店內裝潢典雅、包廂座位多，即使人數眾多也能從容用餐。",
    tip:"推薦：①招牌特上カルビ（頂級牛五花）油花豐富、入口即化；②叙々苑冷麵是燒肉套餐收尾的招牌選擇，酸甜開胃解膩；③午間套餐（ランチコース）份量跟價格較親民，適合中午時段輕鬆享用高品質和牛燒肉。",
    souvenir:"🛍 伴手禮：KITTE博多館內的九州限定甜點禮盒，用餐後可以順道採買。"
  },
  "ららぽーと福岡": {
    intro:"ららぽーと福岡是九州規模數一數二的大型購物中心，2022年開幕後迅速成為福岡南區的購物地標，品牌組合齊全，從國際服飾、生活雜貨到親子遊樂設施應有盡有，館內動線寬敞舒適，很適合安排半天悠閒地逛。",
    tip:"推薦：①美食街匯集多元選擇，從日式定食到亞洲料理都找得到；②館內設有大型親子遊樂區，帶小孩同行也不怕無聊；③不少日本潮流品牌的九州限定店在這裡都設有分店，喜歡逛街的人可以留久一點時間。",
    souvenir:"🛍 伴手禮：館內品牌選擇多，想買生活雜貨、流行服飾伴手禮這裡一次逛齊。"
  },
  "太宰府天満宮": {
    intro:"太宰府天滿宮供奉學問之神菅原道真，與京都北野天滿宮、山口防府天滿宮並列日本三大天滿宮之一，每年吸引數百萬考生跟遊客前來祈求學業與事業順利。參道兩旁老字號店家林立，飄散陣陣烤麻糬的香氣，境內還保留一株傳說會朝著菅原道真流放地飛去的「飛梅」古木。",
    tip:"推薦：①名物梅枝餅（現烤紅豆餡烤餅）幾乎每間店都有自己的獨門配方，建議多比較幾家；②本殿旁的「飛梅」古木跟牛的雕像，傳說摸牛頭可以增加智慧；③境內旁的九州國立博物館可以順道參觀，館藏豐富且建築本身就很有看頭。",
    souvenir:"🛍 伴手禮：參道店家的梅ヶ枝餅禮盒、天滿宮開運御守、九州限定的明太子仙貝。"
  },
  "高良大社": {
    intro:"高良大社鎮座在久留米高良山山腰，是筑後國的一之宮，歷史可以追溯到飛鳥時代，現存本殿、幣殿、拜殿都被指定為日本國家重要文化財。腹地清幽，遠離市區的喧囂，從境內展望台望出去可以將整個筑後平原跟筑後川盡收眼底。",
    tip:"推薦：①正殿建築本身的雕刻工藝值得細細欣賞；②境內展望台是俯瞰久留米市區的私房景點，傍晚時分特別寧靜；③沿參道兩旁的杉木林蔭步道，散步起來相當舒服。",
    souvenir:"🛍 伴手禮：久留米絣（傳統藍染布料）製成的小物、神社授予的交通安全御守。"
  },
  "大砲ラーメン 本店 久留米": {
    intro:"大砲拉麵創業於昭和28年（1953年），是久留米豚骨拉麵的始祖級名店之一，獨門的「呼び戻し」製法讓高湯鍋數十年來從未熄火，每天只添加新湯絕不倒掉舊湯，讓豚骨精華層層堆疊出濃郁卻不死鹹的風味。本店保留開放式廚房，可以近距離看到老師傅熬湯、煮麵的過程。",
    tip:"推薦：①招牌豚骨拉麵一定要點，湯頭濃厚但收尾意外清爽；②便宜的替玉（續麵）幾乎是必點，把剩下的湯喝乾淨才是行家吃法；③久留米名物一口煎餃跟烤飯（やきめし）是很好的配菜，三樣一起點份量剛剛好。",
    souvenir:"🛍 伴手禮：店內販售的真空包拉麵組合，可以把「呼び戻し」湯頭風味帶回家重現。"
  },
  "長浜鮮魚市場": {
    intro:"長浜鮮魚市場位在博多灣邊，是福岡在地漁獲批發跟零售的重要據點，清晨時分最為熱鬧，市場周邊也聚集不少提供現撈海鮮的早餐食堂。這裡同時也是博多長浜拉麵的發源地，過去深夜到清晨營業的拉麵攤，曾是漁市場工作人員收工後的宵夜選擇，後來演變成博多拉麵的重要流派之一。",
    tip:"推薦：①市場周邊食堂的海鮮丼、生魚片定食是招牌，新鮮度直接來自旁邊的批發市場；②想吃拉麵的話，這裡也吃得到元祖級的長浜豚骨拉麵，湯頭偏細麵、偏清爽；③清晨時段人潮較少，適合悠閒地逛市場感受在地生活感。",
    souvenir:"🛍 伴手禮：市場周邊的辛子明太子、乾燥海鮮，喜歡拉麵的話也能找到長浜拉麵真空包。"
  },
  "舞鶴公園 福岡": {
    intro:"舞鶴公園緊鄰福岡城遺跡，佔地遼闊，是福岡市民日常散步、慢跑、賞花的重要綠地。春天櫻花季跟初夏的花菖蒲季是公園最熱鬧的時候，平時園內的護城河、石垣跟大片草坪也很適合悠閒散步。",
    tip:"推薦：①護城河沿岸的散步道視野開闊，適合拍攝城跡跟水景的合照；②公園內的兒童遊樂區跟運動場，是感受福岡日常生活的好地方；③可以順道走到旁邊的福岡城遺跡一起參觀，兩者步行距離很近。",
    souvenir:"🛍 伴手禮：福岡城周邊紀念品店的黑田節主題小物、戰國武將周邊商品。"
  },
  "福岡城跡": {
    intro:"福岡城是江戶時代福岡藩主黑田氏的居城，曾是九州數一數二規模的城郭，雖然天守閣已不復存在，但現存的石垣、城門跟櫓保存得相當完整，依然能感受到當年城郭的雄偉規模。近年在遺跡上重新整理步道跟解說牌，方便遊客一邊散步一邊了解城池的歷史。",
    tip:"推薦：①登上遺跡的制高點可以眺望舞鶴公園跟大濠公園的全景，是拍福岡市區風景的私房角度；②現存的多聞櫓跟石垣值得細細欣賞當年的建築工法；③傍晚時段來訪光線柔和，很適合拍照。",
    souvenir:"🛍 伴手禮：城跡周邊紀念品店的黑田家家紋商品、福岡城御城印。"
  },
  "大濠公園": {
    intro:"大濠公園是仿效中國杭州西湖打造的市民公園，園內大水池環繞步道約2公里，是福岡市民日常散步、慢跑跟划船休憩的重要場所。公園周邊有不少質感咖啡廳跟餐廳，沿著湖畔散步，能感受到福岡人悠閒的生活步調。",
    tip:"推薦：①湖畔的餐廳跟咖啡廳可以邊用餐邊欣賞湖景，推薦安排在這裡吃午餐；②可以在公園租借小船，划船遊湖是很受歡迎的體驗；③沿著環湖步道散步一圈約30-40分鐘，很適合飯後消化。",
    souvenir:"🛍 伴手禮：公園周邊咖啡廳的濾掛咖啡包，帶點福岡的咖啡香氣回家。"
  },
  "FUK COFFEE Parks": {
    intro:"FUK COFFEE Parks是大濠公園旁的人氣咖啡廳，由福岡在地知名咖啡品牌FUK COFFEE開設的分店，主打悠閒放鬆的公園咖啡廳氛圍，店內有開放式露台座位，可以一邊喝咖啡一邊眺望戶外景色。招牌甜點「大濠布丁」口感扎實濃郁，是品牌最受歡迎的招牌商品，經常在中午前就銷售一空。",
    tip:"推薦：①招牌大濠布丁一定要點，喜歡吃甜一點可以加點一球冰淇淋；②現烤泡芙也是人氣品項，外皮酥脆內餡濃郁；③假日人潮多容易完售，建議提早前往或先透過Instagram私訊預約。",
    souvenir:"🛍 伴手禮：店家自家烘焙的濾掛咖啡豆、瓶裝布丁（附保冷袋方便攜帶）。"
  },
  "宮地嶽神社": {
    intro:"宮地嶽神社主殿前懸掛的巨大注連繩重達3噸、長11公尺，是日本規模數一數二的注連繩，氣勢驚人。神社的參道正對著西邊的海與夕陽，每年僅有2月跟10月各一段時間，夕陽會剛好落在參道正中央、沉入海平線，被稱為「光之道」，是攝影愛好者專程前來取景的知名景點。",
    tip:"推薦：①巨大注連繩一定要近距離感受它的震撼氣勢；②境內的松ヶ枝餅（類似太宰府梅枝餅的烤餅）是必吃的參拜點心；③參道商店街也有不少海產乾貨跟伴手禮店，可以順道採買。",
    souvenir:"🛍 伴手禮：松ヶ枝餅禮盒、參道商店街的海產乾貨（魷魚乾、小魚乾）。"
  },
  "呼子朝市": {
    intro:"呼子朝市號稱日本三大朝市之一，已有超過百年歷史，每天早上7:30到中午，松浦町商店街兩側會擺出滿滿的海鮮、蔬果攤販，漁婦們一邊叫賣一邊招呼客人試吃，充滿濃厚的漁港生活氣息。呼子最著名的就是新鮮的劍先魷魚，店家經常在店門口的水槽現場撈捕現殺，鮮度直接反映在餐桌上。",
    tip:"推薦：①呼子名物劍先魷魚活造り一定要嘗試，現點現切的生魚片透明QQ、口感清甜；②吃完活造り剩下的魷魚腳可以請店家加點炸物或塩烤，一魚兩吃不浪費；③朝市裡的魷魚乾貨、魷魚黑輪等小吃很適合邊走邊吃當點心。",
    souvenir:"🛍 伴手禮：呼子名物いかしゅうまい（魷魚燒賣）、魷魚墨汁製品、各式魷魚乾貨，是呼子最具代表性的手信。"
  },
  "七ツ釜 佐賀県": {

function renderRow(item){
  if(item.type==="section"){
    return `<div class="section-label">${item.label}</div>`;
  }
  if(item.type==="note"){
    return `<div class="row"><div class="note">${item.text}</div></div>`;
  }
  if(item.type==="activity"){
    const ic = (TAG[item.tag]||{icon:"・"}).icon;
    const mapUrl = item.map ? (MAP_URL_OVERRIDE[item.map] || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.map)}`) : "";
    const mapLink = mapUrl ? `<a class="maplink" href="${mapUrl}" target="_blank" rel="noopener">📍 地圖</a>` : "";
    const info = item.map ? INFO[item.map] : null;
    const detail = info ? `<div class="activity-detail">
        <p>${info.intro}</p>
        <p class="tip">${info.tip}</p>
        ${info.souvenir ? `<p class="souvenir">${info.souvenir}</p>` : ""}
        ${info.coupon ? `<p class="souvenir">${info.coupon}　<a href="Donquijote_coupon.pdf" target="_blank" rel="noopener" download class="pack-link">下載優惠券PDF</a></p>` : ""}
      </div>` : "";
    const clickable = info ? " clickable" : "";
    const chevron = info ? `<span class="chevron">▾</span>` : "";
    return `<div class="row">
      <span class="dot" style="background:var(--accent)"></span>
      <div class="activity${clickable}">
        <div class="activity-head">
          <span class="ic">${ic}</span>
          <div class="txt">${item.text}${item.time? `<span class="time">${item.time}</span>`:""}${mapLink}</div>
          ${chevron}
        </div>
        ${detail}
      </div>
    </div>`;
  }
  // transit
  const m = MODE[item.mode] || MODE.rail;
  const chips = [];
  if(item.price) chips.push(`<span class="chip price">${item.price}</span>`);
  if(item.transfer) chips.push(`<span class="chip transfer">${item.transfer}</span>`);
  const timeFrom = item.ft ? `<span class="time">${item.ft}</span>` : "";
  const timeTo = item.tt ? `<span class="time">${item.tt}</span>` : "";
  const gmapsUrl = (name)=> MAP_URL_OVERRIDE[name] || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`;
  const fromLink = `<a class="stop-link" href="${gmapsUrl(item.from)}" target="_blank" rel="noopener">${item.from}</a>`;
  const toLink = `<a class="stop-link" href="${gmapsUrl(item.to)}" target="_blank" rel="noopener">${item.to}</a>`;
  return `<div class="row row-transit">
    <span class="dot" style="border-color:${m.color}"></span>
    <div class="transit">
      <div class="leg">
        <span class="stop">${fromLink}${timeFrom? " "+timeFrom : ""}</span>
        <span class="mid"><span class="mid-icon">${m.icon}</span></span>
        <span class="stop right">${toLink}${timeTo? " "+timeTo : ""}</span>
      </div>
      <div class="meta">
        <span class="chip line-tag" style="color:${m.color}">${item.line}</span>
        ${chips.join("")}
      </div>
    </div>
  </div>`;
}

const WMO = {
  0:["☀️","晴朗"],1:["🌤","晴時多雲"],2:["⛅","多雲"],3:["☁️","陰天"],
  45:["🌫","有霧"],48:["🌫","有霧（霜）"],
  51:["🌦","毛毛雨"],53:["🌦","毛毛雨"],55:["🌧","毛毛雨（強）"],

  66:["🌧","凍雨"],67:["🌧","凍雨（強）"],

  80:["🌦","陣雨"],81:["🌧","陣雨"],82:["⛈","強陣雨"],
  95:["⛈","雷雨"],96:["⛈","雷雨（冰雹）"],99:["⛈","雷雨（強冰雹）"]
};
function wmoInfo(code){ return WMO[code] || ["🌡","—"]; }
function wmoAnimClass(code){
  if(code === 0) return "wx-anim-sun";
  if(code === 1 || code === 2) return "wx-anim-cloud-sun";
  if(code === 3 || code === 45 || code === 48) return "wx-anim-cloud";
  if([95,96,99,82].includes(code)) return "wx-anim-storm";
  if([71,73,75].includes(code)) return "wx-anim-snow";
  if(code >= 51) return "wx-anim-rain";
  return "";
}

const WX_PERIODS = [
  { key:"morning",   label:"上午", hours:[6,7,8,9,10,11] },
  { key:"afternoon", label:"下午", hours:[12,13,14,15,16,17] },
  { key:"evening",   label:"晚上", hours:[18,19,20,21,22,23] }
];
const wxState = {}; // { [cityKey]: { current, days: [...], idx } }

function wxAggregatePeriod(hourly, dayIdx, hours){
  const temps=[], pops=[], codes=[];
  hours.forEach(h=>{
    const idx = dayIdx*24 + h;
    if(hourly.temperature_2m[idx] !== undefined){
      temps.push(hourly.temperature_2m[idx]);
      pops.push(hourly.precipitation_probability[idx]);
      codes.push(hourly.weather_code[idx]);
    }
  });
  if(!temps.length) return null;
  const avgTemp = Math.round(temps.reduce((a,b)=>a+b,0)/temps.length);
  const maxPop = Math.max(...pops);
  const worstCode = Math.max(...codes); // heuristic: higher WMO code ≈ more severe weather
  return { avgTemp, maxPop, worstCode };
}

function wxDayColumnWidth(){ return 92; } // 84px column + 8px gap — matches .wx-daycol width in CSS

function renderWeatherDay(key){
  const state = wxState[key];
  if(!state) return;
  const el = document.getElementById("wx-"+key);
  if(!el) return;

  // how many day-columns fit at the current width — this is what makes
  // wider screens show more days at once without any fixed breakpoint
  const containerWidth = el.clientWidth || el.parentElement.clientWidth || 320;
  const PAGER_BTNS_WIDTH = 34*2 + 8*2; // two 34px round buttons + their gaps, reserved space around .wx-daycols
  const daycolsWidth = Math.max(0, containerWidth - PAGER_BTNS_WIDTH);
  const visible = Math.max(1, Math.min(state.days.length, Math.floor(daycolsWidth / wxDayColumnWidth())));
  if(state.idx > state.days.length - visible) state.idx = Math.max(0, state.days.length - visible);

  const slice = state.days.slice(state.idx, state.idx + visible);
  const dayCols = slice.map(day=>{
    const periods = WX_PERIODS.map(p=>{
      const agg = day.periods[p.key];
      if(!agg) return `<div class="wx-p-row"><span class="wx-p-name">${p.label}</span><span class="wx-p-na">－</span></div>`;
      const [icon] = wmoInfo(agg.worstCode);
      const animClass = wmoAnimClass(agg.worstCode);
      return `<div class="wx-p-row">
        <span class="wx-p-name">${p.label}</span>
        <span class="wx-p-icon ${animClass}">${icon}</span>
        <span class="wx-p-temp">${agg.avgTemp}°</span>
        <span class="wx-p-pop mono">${agg.maxPop}%</span>
      </div>`;
    }).join("");
    return `<div class="wx-daycol">
      <div class="wx-daycol-label mono">${day.label}</div>
      ${periods}
    </div>`;
  }).join("");

  el.innerHTML = `
    <div class="wx-current">
      <span class="wx-icon ${wmoAnimClass(state.current.weather_code)}">${wmoInfo(state.current.weather_code)[0]}</span>
      <span class="wx-temp">${Math.round(state.current.temperature_2m)}°C</span>
      <span class="wx-desc">${wmoInfo(state.current.weather_code)[1]}・濕度${state.current.relative_humidity_2m}%</span>
    </div>
    <div class="wx-pager">
      <button type="button" class="wx-pager-btn" data-dir="prev" ${state.idx<=0?"disabled":""}>◀</button>
      <div class="wx-daycols">${dayCols}</div>
      <button type="button" class="wx-pager-btn" data-dir="next" ${state.idx+visible>=state.days.length?"disabled":""}>▶</button>
    </div>
  `;

  el.querySelectorAll(".wx-pager-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const dir = btn.dataset.dir;
      if(dir === "next") state.idx = Math.min(state.days.length - visible, state.idx + visible);
      else state.idx = Math.max(0, state.idx - visible);
      renderWeatherDay(key);
    });
  });
}

window.addEventListener("resize", (()=>{
  let t = null;
  return ()=>{
    clearTimeout(t);
    t = setTimeout(()=>{
      Object.keys(wxState).forEach(key=>{
        if(document.getElementById("wx-"+key)) renderWeatherDay(key);
      });
    }, 200);
  };
})());

async function loadWeather(){
  for(const c of WEATHER_CITIES){
    const el = document.getElementById("wx-"+c.key);
    if(!el || el.dataset.loaded) continue;
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lng}&current=temperature_2m,weather_code,relative_humidity_2m&hourly=temperature_2m,weather_code,precipitation_probability&timezone=Asia%2FTokyo&forecast_days=10`;
      const res = await fetch(url);
      if(!res.ok) throw new Error("fetch failed");
      const data = await res.json();
      el.dataset.loaded = "1";

      const hourly = data.hourly;
      const dayCount = Math.floor(hourly.time.length / 24);
      const days = [];
      for(let d=0; d<dayCount; d++){
        const dateObj = new Date(hourly.time[d*24]);
        const label = (dateObj.getMonth()+1)+"/"+dateObj.getDate();
        const periods = {};
        WX_PERIODS.forEach(p=>{ periods[p.key] = wxAggregatePeriod(hourly, d, p.hours); });
        days.push({ label, periods });
      }

      wxState[c.key] = { current: data.current, days, idx: 0 };
      renderWeatherDay(c.key);
    }catch(err){
      el.innerHTML = `<div class="wx-error">天氣資料載入失敗，請確認網路連線後重新整理頁面。</div>`;
    }
  }
}

const SHINDO_MAP = {
  10:"震度1", 20:"震度2", 30:"震度3", 40:"震度4",
  45:"震度5弱", 50:"震度5強", 55:"震度6弱", 60:"震度6強", 70:"震度7"
};

function shindoColor(scale){
  if(scale >= 55) return "#7A1F1F"; // 震度6弱以上
  if(scale >= 45) return "#A13D2C"; // 震度5弱・5強
  if(scale >= 30) return "#C2445F"; // 震度3・4
  return "#E0879C"; // 震度1・2
}
function formatQuakeTime(t){
  // P2P quake API time format: "2026/08/05 12:34:56.789" — show "08/05<br>12:34"
  const m = String(t).match(/^\d{4}\/(\d{2}\/\d{2}) (\d{2}:\d{2})/);
  return m ? `${m[1]}<br>${m[2]}` : t;
}

async function loadQuakes(){
  const mapEl = document.getElementById("quake-map");
  if(!mapEl || mapEl.dataset.loaded) return;
  mapEl.dataset.loaded = "1";
  try{
    const res = await fetch("https://api.p2pquake.net/v2/history?codes=551&limit=100");
    if(!res.ok) throw new Error("fetch failed");
    const data = await res.json();

    // Kyushu bounding box (mainland Kyushu + nearby offshore epicenters)
    const inKyushu = (hp)=> hp && typeof hp.latitude==="number" && typeof hp.longitude==="number"
      && hp.latitude >= 30.0 && hp.latitude <= 34.2
      && hp.longitude >= 128.0 && hp.longitude <= 132.5;

    const valid = data.filter(q => inKyushu(q.earthquake.hypocenter));
    valid.sort((a,b)=> new Date(b.earthquake.time) - new Date(a.earthquake.time)); // most recent first

    const listEl = document.getElementById("quake-list");
    if(listEl){
      if(!valid.length){
        listEl.innerHTML = `<div class="quake-empty">近期九州地區沒有偵測到地震資訊。</div>`;
      } else {
        listEl.innerHTML = valid.map((q,i)=>{
          const eq = q.earthquake;
          const hp = eq.hypocenter;
          const color = shindoColor(eq.maxScale);
          const shindo = SHINDO_MAP[eq.maxScale] || "—";
          const tsunami = eq.domesticTsunami && eq.domesticTsunami!=="None" && eq.domesticTsunami!=="Unknown"
            ? `<span class="quake-tsunami">⚠ 有海嘯資訊</span>` : "";
          return `<div class="quake-item" data-idx="${i}" style="--quake-c:${color}">
            <div class="quake-item-time mono">${formatQuakeTime(eq.time)}</div>
            <div class="quake-item-body">
              <div class="quake-item-place">${hp.name}</div>
              <div class="quake-item-meta">最大<span class="quake-item-shindo">${shindo}</span>・M${hp.magnitude}・深度${hp.depth}km ${tsunami}</div>
            </div>
          </div>`;
        }).join("");
      }
    }

    const map = L.map(mapEl, {
      scrollWheelZoom:true, doubleClickZoom:true, touchZoom:true,
      boxZoom:true, keyboard:true, zoomControl:true
    }).setView([33.0, 130.6], 7);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd', maxZoom: 19
    }).addTo(map);

    if(!valid.length){
      return; // no recent Kyushu quakes — just show the base map
    }

    const latlngs = [];
    const quakeMarkers = [];
    valid.forEach(q=>{
      const eq = q.earthquake;
      const hp = eq.hypocenter;
      const color = shindoColor(eq.maxScale);
      const radius = 6 + Math.max(0, (Number(hp.magnitude)||3) - 3) * 3;
      const shindo = SHINDO_MAP[eq.maxScale] || "—";
      const tsunami = eq.domesticTsunami && eq.domesticTsunami!=="None" && eq.domesticTsunami!=="Unknown"
        ? `<br><span class="quake-tsunami">⚠ 有海嘯資訊</span>` : "";
      const marker = L.circleMarker([hp.latitude, hp.longitude], {
        radius, color, fillColor:color, fillOpacity:0.55, weight:2
      }).addTo(map).bindPopup(
        `<span class="day-popup">${hp.name}<br>最大${shindo}・M${hp.magnitude}，深度${hp.depth}km<br>${eq.time}${tsunami}</span>`
      );
      quakeMarkers.push(marker);
      latlngs.push([hp.latitude, hp.longitude]);
    });
    if(latlngs.length > 1) map.fitBounds(latlngs, {padding:[24,24]});

    // clicking a list entry pans the map to that quake's marker and opens its popup
    if(listEl){
      listEl.addEventListener("click", (e)=>{
        const item = e.target.closest(".quake-item");
        if(!item) return;
        const idx = Number(item.dataset.idx);
        const marker = quakeMarkers[idx];
        if(!marker) return;
        map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 9), { duration:0.6 });
        setTimeout(()=> marker.openPopup(), 620);
        document.querySelectorAll(".quake-item.selected").forEach(el=>el.classList.remove("selected"));
        item.classList.add("selected");
      });
    }
  }catch(err){
    mapEl.innerHTML = `<div class="wx-error">地震資料載入失敗，請確認網路連線後重新整理頁面。</div>`;
  }
}

(function initScrollReveal(){
  const selector = ".row, .pack-item, .contact-row, .flight-item, .drv-block, .sign-card, .lodging-card, .fs-item, .quake-item";
  const els = document.querySelectorAll(selector);
  if(!("IntersectionObserver" in window)){
    els.forEach(el=>el.classList.add("revealed"));
    return;
  }
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("revealed");
        observer.unobserve(entry.target);
      }
    });
  }, {threshold:0.12, rootMargin:"0px 0px -30px 0px"});
  els.forEach(el=>{
    el.classList.add("reveal");
    observer.observe(el);
  });
})();

function dayStops(day){
  const stops = [];
  const push = (name)=>{
    const c = COORDS[name];
    if(!c) return;
    const last = stops[stops.length-1];
    if(last){
      const dLat = last.lat - c[0], dLng = last.lng - c[1];
      const closeEnough = Math.sqrt(dLat*dLat + dLng*dLng) < 0.003; // ~300m
      if(last.name===name || closeEnough) return;
    }
    stops.push({name, lat:c[0], lng:c[1]});
  };
  day.items.forEach(item=>{
    if(item.type==="transit"){ push(item.from); push(item.to); }
    else if(item.type==="activity" && item.map){ push(item.map); }
  });
  return stops;
}

// ---- Sunrise / sunset ----
const sunLoaded = {}; // idx -> true once fetched

function dayDateISO(dateLabel){
  // dateLabel looks like "8/18（二）" — pick the next upcoming occurrence of that month/day
  const m = dateLabel.match(/(\d+)\/(\d+)/);
  if(!m) return null;
  const month = Number(m[1]), day = Number(m[2]);
  const now = new Date();
  let year = now.getFullYear();
  const candidate = new Date(year, month-1, day);
  if(candidate < now) year += 1; // that date already passed this year — assume next year's trip
  const mm = String(month).padStart(2,"0");
  const dd = String(day).padStart(2,"0");
  return `${year}-${mm}-${dd}`;
}

async function loadSunTimes(idx){
  if(sunLoaded[idx]) return;
  const el = document.getElementById("sun-"+idx);
  if(!el) return;
  const stops = dayStops(days[idx]);
  const iso = dayDateISO(days[idx].date);
  if(!stops.length || !iso){ el.textContent = ""; return; }
  const { lat, lng } = stops[0];
  try{
    const url = `https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lng}&date=${iso}&formatted=0`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("fetch failed");
    const data = await res.json();
    sunLoaded[idx] = true;
    const fmt = (utcStr)=> new Date(utcStr).toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit", timeZone:"Asia/Tokyo"});
    el.textContent = `↑${fmt(data.results.sunrise)} ↓${fmt(data.results.sunset)}`;
  }catch(err){
    el.textContent = "";
  }
}

const dayMaps = {}; // idx -> leaflet map instance

function buildDayMap(idx){
  if(dayMaps[idx]) { dayMaps[idx].invalidateSize(); return; }
  const el = document.getElementById("daymap-"+idx);
  if(!el) return;
  const stops = dayStops(days[idx]);
  if(stops.length < 2){ el.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-size:12px;">（無足夠地點資料）</div>`; return; }

  // when the same spot is revisited later that day, nudge it outward a little
  // so the pin doesn't sit exactly on top of the earlier visit and hide its number
  const seen = {};
  stops.forEach(s=>{
    const key = s.lat.toFixed(4)+","+s.lng.toFixed(4);
    const count = seen[key] || 0;
    seen[key] = count + 1;
    if(count > 0){
      const angle = count * 2.4; // golden-angle-ish spiral
      const radius = 0.0007 * count;
      s.lat += radius * Math.cos(angle);
      s.lng += radius * Math.sin(angle) / Math.cos(s.lat * Math.PI/180);
    }
  });

  const isKaratsu = idx >= 5;
  const color = isKaratsu ? "#165E83" : "#C2445F";

  const map = L.map(el, {
    scrollWheelZoom:true,
    doubleClickZoom:true,
    touchZoom:true,
    boxZoom:true,
    keyboard:true,
    zoomControl:true
  }).setView([stops[0].lat, stops[0].lng], 11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);

  const latlngs = stops.map(s=>[s.lat,s.lng]);

  // arrival pins — all drawn immediately
  stops.forEach((s,i)=>{
    const isStart = i===0, isEnd = i===stops.length-1;
    const ring = isStart ? "0 0 0 3px #2F8F4E, 0 1px 4px rgba(0,0,0,.35)" : isEnd ? "0 0 0 3px #8C7FB0, 0 1px 4px rgba(0,0,0,.35)" : "0 1px 4px rgba(0,0,0,.35)";
    const size = (isStart||isEnd) ? 28 : 24;
    const icon = L.divIcon({
      className:"",
      html:`<div class="daypin" style="background:${color};width:${size}px;height:${size}px;box-shadow:${ring}">${isStart?"起":isEnd?"終":i+1}</div>`,
      iconSize:[size,size], iconAnchor:[size/2,size/2]
    });
    const label = isStart ? `起點：${s.name}` : isEnd ? `終點：${s.name}` : `${i+1}. ${s.name}`;
    L.marker([s.lat,s.lng], {icon}).addTo(map).bindPopup(`<span class="day-popup">${label}</span>`);
  });

  // direction arrows at each leg's midpoint — all drawn immediately
  for(let i=0;i<stops.length-1;i++){
    const a = stops[i], b = stops[i+1];
    const midLat = (a.lat+b.lat)/2, midLng = (a.lng+b.lng)/2;
    const angle = Math.atan2(b.lng-a.lng, b.lat-a.lat) * 180/Math.PI;
    const arrowIcon = L.divIcon({
      className:"",
      html:`<div class="dayarrow" style="color:${color};transform:rotate(${angle}deg)">▲</div>`,
      iconSize:[16,16], iconAnchor:[8,8]
    });
    L.marker([midLat,midLng], {icon:arrowIcon, interactive:false}).addTo(map);
  }

  // route line — all drawn immediately (one polyline per leg keeps the
  // per-leg direction arrows lined up, though there's no visual seam)
  for(let i=0;i<stops.length-1;i++){
    const a = stops[i], b = stops[i+1];
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], {color, weight:3, opacity:0.85}).addTo(map);
  }

  // fit every stop in view — everything is already drawn, no animation
  map.fitBounds(latlngs, {padding:[24,24]});

  dayMaps[idx] = map;
}

function openMoreSheet(){ document.getElementById("moreSheet").classList.add("open"); }

// drag the handle down to dismiss the sheet, like a native bottom sheet
(function initSheetDrag(){
  const panel = document.querySelector(".more-sheet-panel");
  const handle = document.querySelector(".more-sheet-handle");
  if(!panel || !handle) return;
  let startY = 0, dragY = 0, dragging = false;

  function start(y){ dragging = true; startY = y; panel.style.transition = "none"; }
  function move(y){
    if(!dragging) return;
    dragY = Math.max(0, y - startY);
    panel.style.transform = `translateY(${dragY}px)`;
  }
  function end(){
    if(!dragging) return;
    dragging = false;
    panel.style.transition = "transform .25s ease";
    if(dragY > 90){
      panel.style.transform = "translateY(100%)";
      setTimeout(()=>{ closeMoreSheet(); panel.style.transform = ""; }, 200);
    } else {
      panel.style.transform = "";
    }
    dragY = 0;
  }

  handle.addEventListener("touchstart", e=>start(e.touches[0].clientY), {passive:true});
  handle.addEventListener("touchmove", e=>move(e.touches[0].clientY), {passive:true});
  handle.addEventListener("touchend", end);
  handle.addEventListener("mousedown", e=>{
    start(e.clientY);
    const onMove = ev=>move(ev.clientY);
    const onUp = ()=>{ end(); document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
})();
document.getElementById("moreSheetClose").addEventListener("click", closeMoreSheet);

// re-measures an open accordion's max-height after content inside it
// expands, so nothing gets clipped
function resyncFoodAreaHeight(fromEl){
  const list = fromEl.closest(".food-area-list");
  if(list && list.style.maxHeight && list.style.maxHeight !== "0px"){
    list.style.maxHeight = list.scrollHeight + "px";
  }
}

document.addEventListener("click", (e)=>{
  const head = e.target.closest(".food-area-head");
  if(head){
    const list = document.getElementById("food-area-" + head.dataset.area);
    if(!list) return;
    const open = head.classList.toggle("open");
    list.style.maxHeight = open ? (list.scrollHeight + "px") : "0px";
    return;
  }

  const souvBtn = e.target.closest(".souvenir-item");
  if(souvBtn){ toggleSouvenirMap(souvBtn); return; }
});

function toggleSouvenirMap(btn){
  const slot = document.getElementById(btn.dataset.mapId);
  if(!slot) return;
  const isOpen = slot.classList.toggle("open");
  if(!isOpen){ resyncFoodAreaHeight(slot); return; }

  if(!slot.dataset.built){
    slot.dataset.built = "1";
    const coord = COORDS[btn.dataset.coordKey];
    const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(btn.dataset.name)}`;
    if(coord){
      renderInlineMap(slot, coord[0], coord[1], btn.dataset.name, gmapsUrl);
    } else {
      slot.innerHTML = `<div class="food-map-loading">目前沒有這個地點的座標，<a href="${gmapsUrl}" target="_blank" rel="noopener">直接開 Google Maps 查詢 →</a></div>`;
    }
  }
  resyncFoodAreaHeight(slot);
}

function renderInlineMap(slot, lat, lng, label, gmapsUrl){
  slot.innerHTML = `<div class="food-map-canvas"></div><a class="maplink food-map-gmaps" href="${gmapsUrl}" target="_blank" rel="noopener">📍 在 Google Maps 開啟</a>`;
  const canvas = slot.querySelector(".food-map-canvas");
  const map = L.map(canvas, { zoomControl:false, attributionControl:false }).setView([lat,lng], 16);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { subdomains:'abcd', maxZoom:19 }).addTo(map);
  L.marker([lat,lng]).addTo(map).bindPopup(label);
}

function updateBottomNav(page, isExtra){
  const numEl = document.getElementById("bnCurrentNum");
  const themeEl = document.getElementById("bnCurrentTheme");
  const prevBtn = document.getElementById("bnPrev");
  const nextBtn = document.getElementById("bnNext");
  if(!numEl) return;
  if(isExtra){
    numEl.textContent = "EXTRA";
    themeEl.textContent = EXTRA_PAGE_META[page].icon + " " + EXTRA_PAGE_META[page].label;
    prevBtn.disabled = true;
    nextBtn.disabled = true;
  } else {
    const idx = Number(page);
    numEl.textContent = "DAY " + String(idx+1).padStart(2,"0");
    themeEl.textContent = days[idx].theme;
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= days.length-1;
  }
  document.querySelectorAll(".more-sheet-day").forEach(d=>{
    d.classList.toggle("active", !isExtra && d.dataset.page === page);
  });
}

document.getElementById("bnPrev").addEventListener("click", ()=>{
  const btn = document.querySelector(".daytab.active");
  if(!btn) return;
  const idx = Number(btn.dataset.page);
  if(idx > 0) switchDayWithTransition(String(idx-1), "prev");
});
document.getElementById("bnNext").addEventListener("click", ()=>{
  const btn = document.querySelector(".daytab.active");
  if(!btn) return;
  const idx = Number(btn.dataset.page);
  if(idx < days.length-1) switchDayWithTransition(String(idx+1), "next");
});
document.getElementById("bnCurrent").addEventListener("click", ()=>{ buildMoreSheet(); openMoreSheet(); });
document.getElementById("bnMore").addEventListener("click", ()=>{ buildMoreSheet(); openMoreSheet(); });
document.getElementById("moreSheetBackdrop").addEventListener("click", closeMoreSheet);
document.getElementById("moreSheet").addEventListener("click", (e)=>{
  const dayCard = e.target.closest(".more-sheet-day");
  const itemCard = e.target.closest(".more-sheet-item");
  if(dayCard){ activatePage(dayCard.dataset.page); closeMoreSheet(); }
  else if(itemCard){ activatePage(itemCard.dataset.page); closeMoreSheet(); }
});


function activatePage(page, {jump=true, dir=null}={}){
  const isExtra = EXTRA_PAGES.includes(page);
  const btn = isExtra ? document.querySelector(`.util-btn[data-page="${page}"]`)
                       : document.querySelector(`.daytab[data-page="${page}"]`);
  const el = (page==="packing") ? document.getElementById("page-packing")
           : (page==="weather") ? document.getElementById("page-weather")
           : (page==="quake") ? document.getElementById("page-quake")
           : (page==="flights") ? document.getElementById("page-flights")
           : (page==="driving") ? document.getElementById("page-driving")
           : (page==="contacts") ? document.getElementById("page-contacts")
           : (page==="food") ? document.getElementById("page-food")
           : document.getElementById("day-"+page);
  if(!btn || !el) return;
  document.querySelectorAll(".daytab").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".util-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".day-page").forEach(p=>p.classList.remove("active","slide-next","slide-prev","exit-next","exit-prev"));
  btn.classList.add("active");
  el.classList.add("active");
  el.querySelectorAll(".reveal:not(.revealed)").forEach(r=>r.classList.add("revealed"));
  if(dir === "next") el.classList.add("slide-next");
  else if(dir === "prev") el.classList.add("slide-prev");
  updateBottomNav(page, isExtra);

  if(page==="weather") loadWeather();
  else if(page==="quake") loadQuakes();
  else if(!isExtra){ buildDayMap(Number(page)); loadSunTimes(Number(page)); }

  if(!isExtra) btn.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
  if(jump) window.scrollTo({top:0, behavior:"smooth"});
}

// plays a brief exit animation on the current day page before switching,
// so day-to-day navigation reads as a clear directional slide rather than
// a plain cross-fade
function switchDayWithTransition(newPage, dir){
  const current = document.querySelector(".day-page.active");
  if(current && dir){
    current.classList.add(dir === "next" ? "exit-next" : "exit-prev");
    setTimeout(()=>{ activatePage(newPage, {dir}); }, 160);
  } else {
    activatePage(newPage, {dir});
  }
}

document.getElementById("dayNav").addEventListener("click",(e)=>{
  const btn = e.target.closest(".daytab");
  if(!btn) return;
  activatePage(btn.dataset.page);
});

document.getElementById("utilBar").addEventListener("click",(e)=>{
  const btn = e.target.closest(".util-btn");
  if(!btn) return;
  activatePage(btn.dataset.page);
});

// ---- Packing list persistence ----
const PACK_KEY = "kyushu-packing-v1";
function loadPackState(){
  try{ return JSON.parse(localStorage.getItem(PACK_KEY)) || {}; }catch(e){ return {}; }
}
function savePackState(state){
  try{ localStorage.setItem(PACK_KEY, JSON.stringify(state)); }catch(e){}
}
function refreshPackProgress(){
  const boxes = document.querySelectorAll("#page-packing input[type=checkbox]");
  const total = boxes.length;
  const checked = document.querySelectorAll("#page-packing input[type=checkbox]:checked").length;
  const fill = document.getElementById("packFill");
  const count = document.getElementById("packCount");
  if(fill) fill.style.width = (total? (checked/total*100) : 0) + "%";
  if(count) count.textContent = checked + " / " + total;
  if(total > 0 && checked === total){
    packCelebrate();
  } else {
    packUncelebrate();
  }
}

// small confetti burst celebrating a fully-packed list — only fires once per
// completion (guarded so re-checking an already-complete list doesn't replay it)
let packCelebrated = false;
// small toast that slides up from the bottom, e.g. after a successful copy
let toastTimer = null;
function showToast(msg){
  let el = document.getElementById("appToast");
  if(!el){
    el = document.createElement("div");
    el.id = "appToast";
    el.className = "app-toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.classList.remove("show"); }, 1600);
}

function fireConfetti(originYPercent){
  const colors = ["#E87A90","#8C7FB0","#C2445F","#F5C2CE"];
  const container = document.createElement("div");
  container.className = "pack-confetti";
  for(let i=0;i<28;i++){
    const bit = document.createElement("span");
    bit.style.left = (45 + Math.random()*10) + "%";
    bit.style.top = (originYPercent || 35) + "%";
    bit.style.background = colors[i % colors.length];
    bit.style.animationDelay = (Math.random()*0.15) + "s";
    bit.style.setProperty("--dx", (Math.random()*220-110) + "px");
    bit.style.setProperty("--rot", (Math.random()*520-260) + "deg");
    container.appendChild(bit);
  }
  document.body.appendChild(container);
  setTimeout(()=>{ container.remove(); }, 1600);
}
function packCelebrate(){
  if(packCelebrated) return;
  packCelebrated = true;
  fireConfetti(35);
}
function packUncelebrate(){ packCelebrated = false; }
(function initContactsGate(){
  const gate = document.getElementById("contactsGate");
  const content = document.getElementById("contactsContent");
  const input = document.getElementById("gateInput");
  const btn = document.getElementById("gateSubmit");
  const msg = document.getElementById("gateMsg");
  if(!gate || !content || !input || !btn) return;

  const ANSWER = "王浩恩";

  function unlock(){
    gate.style.display = "none";
    content.style.display = "block";
    content.classList.add("fade-in");
  }

  function tryAnswer(){
    const val = input.value.trim();
    if(val === ANSWER){
      msg.textContent = "✓ 答對了！";
      msg.classList.add("ok");
      gate.classList.add("gate-success");
      fireConfetti(30);
      setTimeout(unlock, 650);
    } else {
      msg.textContent = "不對喔，再想想～";
      msg.classList.remove("ok");
    }
  }
  btn.addEventListener("click", tryAnswer);
  input.addEventListener("keydown", (e)=>{ if(e.key === "Enter") tryAnswer(); });
})();

(function initPacking(){
  const state = loadPackState();
  document.querySelectorAll("#page-packing input[type=checkbox]").forEach(box=>{
    const key = box.dataset.key;
    if(state[key]) box.checked = true;
    box.addEventListener("change", ()=>{
      const s = loadPackState();
      s[key] = box.checked;
      savePackState(s);
      const item = box.closest(".pack-item");
      item.classList.toggle("done", box.checked);
      if(box.checked){
        item.classList.remove("just-checked");
        void item.offsetWidth;
        item.classList.add("just-checked");
      }
      refreshPackProgress();
    });
    if(box.checked) box.closest(".pack-item").classList.add("done");
  });
  document.querySelectorAll("#page-packing .pack-link").forEach(a=>{
    a.addEventListener("click", e=>e.stopPropagation());
  });
  document.querySelectorAll(".addr-copy-mini").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();
      const text = btn.dataset.val || "";
      const done = ()=>{
        btn.textContent = "✓";
        btn.classList.add("copied");
        showToast("已複製");
        setTimeout(()=>{ btn.textContent = "📋"; btn.classList.remove("copied"); }, 1400);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done).catch(()=>{
          const ta = document.createElement("textarea");
          ta.value = text; document.body.appendChild(ta); ta.select();
          try{ document.execCommand("copy"); done(); }catch(err){}
          document.body.removeChild(ta);
        });
      } else {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); done(); }catch(err){}
        document.body.removeChild(ta);
      }
    });
  });
  refreshPackProgress();
  const resetBtn = document.getElementById("packReset");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{
    savePackState({});
    document.querySelectorAll("#page-packing input[type=checkbox]").forEach(box=>{
      box.checked = false;
      box.closest(".pack-item").classList.remove("done");
    });
    refreshPackProgress();
  });
})();

function pageFromHash(){
  const m = location.hash.match(/day-(\d+)/);
  if(location.hash === "#packing") return "packing";
  if(location.hash === "#weather") return "weather";
  if(location.hash === "#quake") return "quake";
  if(location.hash === "#flights") return "flights";
  if(location.hash === "#driving") return "driving";
  if(location.hash === "#contacts") return "contacts";
  if(location.hash === "#food") return "food";
  return m ? m[1] : 0;
}
activatePage(pageFromHash(), {jump:false});
window.addEventListener("hashchange", ()=> activatePage(pageFromHash()));

// swipe left/right anywhere on the page to switch days (not just via the
// bottom nav) — ignored while touching a Leaflet map, so map panning still
// works normally, and ignored when the gesture is mostly vertical (scrolling)
(function initSwipeDays(){
  const target = document.getElementById("main");
  if(!target) return;
  let startX = 0, startY = 0, tracking = false;

  target.addEventListener("touchstart", (e)=>{
    if(e.target.closest(".leaflet-container")) { tracking = false; return; }
    if(e.touches.length !== 1) { tracking = false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive:true });

  target.addEventListener("touchend", (e)=>{
    if(!tracking) return;
    tracking = false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // not a clear horizontal swipe

    const activeTab = document.querySelector(".daytab.active");
    if(!activeTab) return; // only switch days while on a day page, not an extra page
    const idx = Number(activeTab.dataset.page);
    if(dx < 0 && idx < days.length - 1) switchDayWithTransition(String(idx + 1), "next");      // swipe left → next day
    else if(dx > 0 && idx > 0) switchDayWithTransition(String(idx - 1), "prev");                // swipe right → previous day
    else if(dx < 0 || dx > 0) shakeBoundary();  // swiped further but already at the first/last day
  }, { passive:true });
})();

// shakes the current day page briefly to signal "you're at the first/last day"
function shakeBoundary(){
  const current = document.querySelector(".day-page.active");
  if(!current) return;
  current.classList.remove("shake-boundary");
  void current.offsetWidth;
  current.classList.add("shake-boundary");
}
