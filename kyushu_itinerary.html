<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九州行程表｜福岡・北九州・唐津・佐賀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --ink:#1B2A44;
    --ink-soft:#4A5568;
    --paper:#F1F3F6;
    --card:#FFFFFF;
    --line:#D8DEE6;
    --accent:#BF3B26;      /* torii vermillion - meals / highlight */
    --gold:#B8935A;        /* cable/slope, price chips */
    --rail:#8C2A2A;        /* train lines */
    --bus:#3E7C59;         /* bus */
    --boat:#0E7C86;        /* ferry */
    --cable:#B8935A;       /* cablecar / slopecar */
    --walk:#8A8A8A;        /* on foot */
    --car:#6B4C9A;         /* taxi / rental car */
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC","Hiragino Sans",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"JetBrains Mono",monospace;}
  .display{font-family:"Shippori Mincho",serif;}

  /* ---------- Header ---------- */
  header.hero{
    background:
      radial-gradient(1200px 300px at 10% -20%, rgba(191,59,38,0.18), transparent 60%),
      linear-gradient(180deg,#1B2A44 0%, #223457 100%);
    color:#F1F3F6;
    padding:34px 20px 22px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header.hero::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 18px, transparent 18px 30px);
    opacity:.7;
  }
  .eyebrow{
    letter-spacing:.35em;
    font-size:11px;
    text-transform:uppercase;
    color:#C9CFDA;
    margin-bottom:10px;
    font-family:"JetBrains Mono",monospace;
  }
  h1.title{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:clamp(28px,6vw,42px);
    margin:0 0 6px;
    letter-spacing:.04em;
  }
  .subtitle{
    color:#C9CFDA;
    font-size:14px;
    margin:0;
  }
  /* ---------- Day nav ---------- */
  nav.daynav{
    position:sticky; top:0; z-index:20;
    background:#1B2A44;
    display:flex;
    overflow-x:auto;
    padding:0 6px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    scrollbar-width:none;
  }
  nav.daynav::-webkit-scrollbar{display:none;}
  .daytab{
    flex:0 0 auto;
    background:transparent;
    border:none;
    color:#9AA6BC;
    padding:12px 16px 10px;
    cursor:pointer;
    text-align:center;
    border-bottom:3px solid transparent;
    font-family:"Noto Sans TC",sans-serif;
    position:relative;
  }
  .daytab .num{
    display:block;
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    letter-spacing:.1em;
    color:#7E8AA3;
  }
  .daytab .lbl{
    display:block;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    margin-top:2px;
  }
  .daytab.active{
    color:#fff;
    border-bottom-color:var(--accent);
  }
  .daytab.active .num{color:var(--accent);}
  .daytab:hover{color:#fff;}

  /* ---------- Legend ---------- */
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
    padding:14px 16px 4px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* ---------- Day page ---------- */
  main{max-width:640px; margin:0 auto; padding:18px 16px 60px;}
  .day-page{display:none;}
  .day-page.active{display:block; animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .day-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin:6px 0 18px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
  }
  .day-head .dnum{
    font-family:"Shippori Mincho",serif;
    font-size:34px;
    font-weight:700;
    color:var(--accent);
    line-height:1;
  }
  .day-head .dmeta{flex:1;}
  .day-head .ddate{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .day-head .dtitle{
    font-size:19px;
    font-weight:700;
    margin-top:2px;
  }

  /* day route map */
  .daymap-wrap{ margin:0 0 20px; }
  .daymap-label{
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    color:#9AA6BC;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .daymap{
    height:220px;
    border-radius:14px;
    border:1px solid var(--line);
    overflow:hidden;
    box-shadow:0 1px 2px rgba(27,42,68,.04);
    background:#E9EDF1;
    position:relative;
    isolation:isolate;
    z-index:0;
  }
  .daypin{
    width:24px; height:24px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:11px;
    font-family:"JetBrains Mono",monospace;
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
  }
  .dayarrow{
    width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    line-height:1;
    text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
    pointer-events:none;
  }
  .day-popup{ font-family:"Noto Sans TC",sans-serif; font-size:12.5px; font-weight:600; color:var(--ink); }

  /* timeline */
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{
    content:"";
    position:absolute; left:9px; top:6px; bottom:6px; width:2px;
    background:var(--line);
  }
  .row{position:relative; margin-bottom:14px;}
  .row .dot{
    position:absolute; left:-26px; top:5px;
    width:11px; height:11px; border-radius:50%;
    border:2px solid var(--card);
    box-shadow:0 0 0 1.5px var(--line);
  }

  /* transit card */
  .transit{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 14px;
    box-shadow:0 1px 2px rgba(27,42,68,.04);
  }
  .transit .leg{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:13.5px;
  }
  .transit .stop{font-weight:700;}
  .transit .time{font-family:"JetBrains Mono",monospace; color:var(--ink-soft); font-size:12.5px;}
  .transit .mid{
    display:flex; align-items:center; gap:6px;
    flex:1; justify-content:center; min-width:60px;
    color:var(--ink-soft); font-size:12px;
  }
  .transit .mid .arrow{color:var(--line);}
  .transit .meta{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;
  }
  .chip{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
    background:#F1F3F6;
    color:var(--ink-soft);
    border:1px solid var(--line);
  }
  .chip.price{color:#8a6a1f; border-color:#e6d5ad; background:#FBF4E4;}
  .chip.transfer{color:var(--accent); border-color:#f0c9bf; background:#FBEDE9;}
  .line-tag{
    font-size:12px; font-weight:700;
  }

  /* activity card */
  .activity{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:var(--radius);
    padding:12px 14px;
  }
  .activity.clickable{ cursor:pointer; }
  .activity-head{
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .activity .num{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:16px;
    color:var(--accent);
    width:20px;
    flex:0 0 auto;
  }
  .activity .ic{font-size:18px; flex:0 0 auto;}
  .activity .txt{font-size:14.5px; font-weight:500; line-height:1.5; flex:1;}
  .activity .txt .time{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-left:6px;
  }
  .chevron{
    flex:0 0 auto;
    color:var(--ink-soft);
    font-size:13px;
    margin-left:4px;
    transition:transform .2s ease;
  }
  .activity.open .chevron{ transform:rotate(180deg); }
  .activity-detail{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .25s ease, opacity .2s ease, margin-top .25s ease;
  }
  .activity.open .activity-detail{
    max-height:520px;
    opacity:1;
    margin-top:10px;
  }
  .activity-detail p{
    margin:0 0 6px;
    font-size:13px;
    line-height:1.6;
    color:var(--ink-soft);
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .activity-detail p.tip{
    color:var(--ink);
    border-top:none;
    padding-top:0;
    margin-bottom:0;
  }
  .activity-detail p.tip::before{
    content:"💡 ";
  }
  .maplink{
    display:inline-flex;
    align-items:center;
    gap:3px;
    margin-left:8px;
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    font-weight:600;
    color:#1B5E8C;
    background:#EAF2F8;
    border:1px solid #C7DDEC;
    border-radius:999px;
    padding:2px 9px;
    text-decoration:none;
    vertical-align:middle;
  }
  .maplink:hover{background:#DCEBF5;}

  /* note / info card */
  .note{
    background:#FBF4E4;
    border:1px dashed #D9BE85;
    border-radius:var(--radius);
    padding:10px 14px;
    font-size:13px;
    color:#6b5316;
  }
  .note b{color:#4a3a10;}

  .section-label{
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;
    letter-spacing:.15em;
    color:#9AA6BC;
    text-transform:uppercase;
    margin:22px 0 8px 0;
  }
  .row:first-child .section-label{margin-top:0;}

  footer{
    text-align:center;
    padding:20px;
    font-size:11px;
    color:#9AA6BC;
    font-family:"JetBrains Mono",monospace;
  }

  @media(max-width:420px){
    .transit .leg{flex-direction:row; font-size:12.5px;}
    .transit .stop{max-width:34%;}
  }

  /* ---------- Packing list ---------- */
  .pack-progress{
    display:flex; align-items:center; gap:10px;
    margin:0 0 20px;
  }
  .pack-bar{
    flex:1; height:8px; border-radius:999px;
    background:var(--line); overflow:hidden;
  }
  .pack-fill{
    height:100%; width:0%;
    background:var(--accent);
    border-radius:999px;
    transition:width .25s ease;
  }
  .pack-count{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .pack-reset{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 12px;
    cursor:pointer;
  }
  .pack-reset:hover{ border-color:var(--accent); color:var(--accent); }

  .pack-group{ margin-bottom:22px; }
  .pack-cat{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:14.5px;
    color:var(--ink);
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .pack-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 14px;
    margin-bottom:8px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .pack-item:hover{ border-color:var(--gold); }
  .pack-item input[type=checkbox]{
    width:18px; height:18px;
    accent-color:var(--accent);
    flex:0 0 auto;
    cursor:pointer;
  }
  .pack-text{ font-size:14px; }
  .pack-link{
    display:inline-block;
    margin-left:6px;
    font-size:12px;
    font-weight:700;
    color:#1B5E8C;
    text-decoration:underline;
  }
  .pack-item.done{ background:#F6F2EA; }
  .pack-item.done .pack-text{
    color:var(--ink-soft);
    text-decoration:line-through;
  }
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow">Kyushu Travel Log · 8 Days</div>
  <h1 class="title">九州行程表</h1>
  <p class="subtitle">福岡 ・ 北九州 ・ 相島 ・ 太宰府 ・ 唐津 ・ 佐賀 ・ 武雄</p>
</header>

<nav class="daynav" id="dayNav"></nav>

<div class="legend">
  <span><i class="dot" style="background:var(--rail)"></i>鐵路</span>
  <span><i class="dot" style="background:var(--bus)"></i>巴士</span>
  <span><i class="dot" style="background:var(--boat)"></i>渡船</span>
  <span><i class="dot" style="background:var(--cable)"></i>纜車/坡道車</span>
  <span><i class="dot" style="background:var(--walk)"></i>步行</span>
  <span><i class="dot" style="background:var(--car)"></i>計程車/租車</span>
</div>

<main id="main"></main>

<footer>做成日: Kyushu Itinerary · 8/18 – 8/25</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const MODE = {
  rail:  {color:"var(--rail)",  icon:"🚃", label:"鐵路"},
  bus:   {color:"var(--bus)",   icon:"🚌", label:"巴士"},
  boat:  {color:"var(--boat)",  icon:"⛴",  label:"渡船"},
  cable: {color:"var(--cable)", icon:"🚡", label:"纜車"},
  walk:  {color:"var(--walk)",  icon:"🚶", label:"步行"},
  car:   {color:"var(--car)",   icon:"🚕", label:"車"}
};
const TAG = {
  meal:{icon:"🍽"}, sight:{icon:"🏯"}, shop:{icon:"🛍"}, view:{icon:"🌄"}, onsen:{icon:"♨"}
};

const INFO = {
  "博多駅": {
    intro:"博多車站是JR九州的心臟地帶，新幹線、在來線跟地下鐵在此交會，同時也是進出福岡最主要的門戶。車站本身就是「JR博多CITY」複合商場，橫向連接博多阪急百貨，地下街更延伸出數百公尺的餐飲跟伴手禮店。剛抵達福岡想找地方寄放行李、順便吃頓像樣的午餐，這裡幾乎不用移動就能一次滿足。",
    tip:"推薦：①一風堂、一蘭等知名豚骨拉麵在博多駅周邊都有分店，方便比較不同流派；②地下街的鐵道便當跟明太子伴手禮專賣店集中好逛，買回程禮很省時間；③博多口外的老牌烏龍麵店「牧のうどん」，湯頭偏甜、麵條軟嫩，是九州系烏龍麵的代表。"
  },
  "博多運河城 キャナルシティ博多": {
    intro:"博多運河城是福岡最具代表性的大型複合式商場，由多棟色彩繽紛的建築圍繞一條人工運河興建而成，結合購物、餐飲、劇場跟飯店機能，規模在福岡市區數一數二。廣場中央每天固定時段都會上演音樂配合燈光的噴泉秀，晚上打燈後氣氛特別浪漫，是福岡人假日約會、外國遊客必訪的地標之一。",
    tip:"推薦：①B1「拉麵競技場」一次集合九州各地知名拉麵店，可以少量多次比較不同風味；②劇場棟頂樓的美食街選擇多，也適合帶小朋友的家庭；③晚上留一點時間看廣場噴泉秀，搭配周邊咖啡廳邊看邊休息。"
  },
  "福岡 天神": {
    intro:"天神是福岡最核心的商業區，天神地下街跟周邊的岩田屋、大丸百貨串聯起龐大的購物跟餐飲網絡，晚上更是居酒屋、屋台跟酒吧林立的不夜城。這裡也是福岡屋台文化的重要據點，沿著昭和通、渡邊通一帶，傍晚開始就會陸續擺出一整排路邊屋台，是體驗福岡在地夜生活最經典的方式。",
    tip:"推薦：①找一攤路邊屋台吃豚骨拉麵配煎餃，順便跟隔壁的在地人聊聊天；②今泉一帶巷弄裡藏了不少道地居酒屋跟串燒店，適合續攤；③想吃點別的可以到天神地下街覓食，烏龍麵、丼飯、甜點選擇都很多。"
  },
  "新時代 福岡天神店": {
    intro:"新時代是發明「炸雞皮串」的連鎖居酒屋，由前職業足球選手一手打造品牌，主打招牌「傳串」自2010年開賣以來已經累積賣出超過兩億支，是福岡年輕人跟遊客都愛去的宵夜熱點。店內氣氛熱鬧，點餐時服務生會現場把串烤堆疊成金字塔造型上桌，視覺效果十足，很適合三五好友聚餐續攤。",
    tip:"推薦：①招牌「傳串」（炸雞皮串）一定要點，一次點10支以上還會疊成金字塔造型；②人氣第二名的白色ハラミ（雞胸軟骨部位）串，肉質軟嫩多汁；③收尾可以點大人氣的大學芋冰淇淋當甜點。"
  },
  "ドン・キホーテ 福岡天神本店": {
    intro:"唐吉訶德是日本全國連鎖的大型雜貨、藥妝店，福岡天神本店24小時營業，貨架又高又密集，從藥妝保養品、零食伴手禮到生活雜貨、電器一應俱全，逛起來很像挖寶遊戲。深夜時段依然燈火通明，是自由行旅客補貨、買宵夜零食的固定班底。",
    tip:"推薦：①日本國民藥妝像是眼藥水、感冒藥、面膜都可以在這裡比價；②期間限定或地區限定零食是送禮的好選擇；③免稅專櫃的生活雜貨（廚房用品、季節小物）也很受歡迎，晚上人潮多記得預留排隊結帳時間。"
  },
  "相島 福岡県": {
    intro:"相島是福岡近郊知名的「貓島」，曾被CNN選入世界六大貓島之一，島上約有150～200隻貓咪自由自在地生活在漁港跟聚落之間，對人非常親近。全島一周大約5公里，環島步道約2小時可以走完，沿途能看到石垣道路、海邊長椅跟古老的漁村街景，是體驗離島慢步調生活的絕佳去處。從福岡市區出發，搭配電車轉巴士再轉渡輪，單程大約1小時左右就能抵達，交通意外地方便。",
    tip:"推薦：①島上居民經營的食堂提供現撈生魚片定食，新鮮度沒話說，建議趁中午船班抵達前先卡位；②當地海帶（わかめ）口感特別有嚼勁，是外地吃不到的滋味；③沿著環島步道慢慢走，隨時都可能遇到窩在轉角曬太陽的貓咪，記得帶相機捕捉這些瞬間。"
  },
  "小倉駅": {
    intro:"小倉車站是北九州市的交通樞紐，車站本身直通商場跟地下街，新幹線口周邊也聚集了不少連鎖跟在地美食店，是移動中間覓食的好地方。北九州以烏龍麵文化聞名，湯頭偏甜、麵條軟嫩是在地特色，跟博多豚骨拉麵是完全不同的九州飲食風格。",
    tip:"推薦：①北九州在地連鎖烏龍麵「資さんうどん」是必吃選擇，肉烏龍麵跟牛蒡天婦羅都很有人氣；②車站內的九州拉麵名店也可以順道嘗鮮；③想吃點輕食的話，站內麵包店跟甜點店選擇也不少。"
  },
  "小倉城": {
    intro:"小倉城是江戶時代由細川氏建造的城堡，之後由小笠原氏接手治理，天守閣採用少見的「唐造り」樣式，頂層比下層更寬，外型獨具特色。城內展示戰國時期到江戶時代的武具、文物，登上天守閣可以360度俯瞰小倉市區跟緊鄰的紫川。",
    tip:"推薦：①天守閣內的歷史文物展示，適合喜歡日本戰國史的人細細參觀；②旁邊的小倉城庭園是仿江戶時代大名庭園打造的迴遊式庭園，可以順道走走；③傍晚時分天守閣打燈後很好拍照，是小倉的地標夜景之一。"
  },
  "あるあるCity 北九州": {
    intro:"あるあるCity是北九州市打造的動漫、次文化聖地，整棟大樓從地下1樓到7樓幾乎都是動漫周邊、漫畫、模型跟偶像相關商店，5、6樓更設有北九州市漫畫博物館，由《宇宙戰艦大和號》《銀河鐵道999》的作者松本零士擔任榮譽館長。假日經常舉辦聲優跟偶像的見面會、演唱活動，是喜歡日本次文化的人不能錯過的景點。",
    tip:"推薦：①漫畫博物館裡展示松本零士的原畫跟人物模型，粉絲一定要朝聖；②館內的周邊商店（如駿河屋、Animate）可以慢慢挖寶絕版商品；③留意當天有沒有偶像或聲優活動，現場氣氛通常很熱鬧。"
  },
  "門司港レトロ": {
    intro:"門司港曾是明治到大正時期九州對外貿易的第一大港，舊門司稅關、舊大阪商船大樓、舊門司三井俱樂部等紅磚洋樓建築保存完整，整條海港老街散發濃厚的異國風情，退潮時分坐在關門海峽邊看夕陽，更是遊客公認的浪漫時刻。",
    tip:"推薦：①門司港發源的名物「燒咖哩」（焼きカレー）幾乎每間餐廳都有自己的獨門版本，值得比較；②海港周邊有不少賣海鮮串跟炸物的小吃攤，邊走邊吃很愜意；③傍晚一定要走到親水區看夕陽落入關門海峽，天氣好時能同時看到對岸下關的燈火。"
  },
  "皿倉山展望台": {
    intro:"皿倉山是北九州市郊的知名夜景山，需要先搭無料接駁巴士到山麓，再轉乘纜車跟坡道車才能抵達山頂展望台，整個交通過程本身就充滿樂趣。山頂視野遼闊，可以將北九州工業區跟關門海峽的璀璨燈火盡收眼底，曾被列為日本三大夜景之一。",
    tip:"推薦：①傍晚時段上山可以連續看到夕陽轉夜景兩種截然不同的風景；②展望台旁有販賣輕食跟飲料的小店，可以邊賞夜景邊小憩；③纜車跟坡道車本身也是拍照亮點，天氣晴朗時可以看到很遠的海岸線。"
  },
  "東長寺 福岡": {
    intro:"東長寺是平安時代高僧空海（弘法大師）從中國學成歸國後，在博多創建的日本第一座真言宗寺院，擁有超過1200年的歷史。寺內供奉的木造福岡大佛高達約10.8公尺，是日本最大的木造坐佛之一，莊嚴的佛像在博多鬧區中格外顯眼。",
    tip:"推薦：①一定要體驗大佛底下漆黑的「地獄極樂巡り」通道，摸著牆壁在全黑空間裡走一圈，結束後有種重生的感覺；②五重塔是近年新建的建築，色彩鮮豔很好拍照；③境內販售的御守也是熱門的伴手禮選擇。"
  },
  "櫛田神社 福岡": {
    intro:"櫛田神社是博多的總鎮守，已有超過1200年歷史，每年7月舉辦的「博多祇園山笠祭」是日本三大祭典之一，祭典期間男丁們扛著重達一噸的山笠花車在市區狂奔，場面壯觀。就算不是祭典期間，神社境內也長年展示著一座巨大華麗的裝飾山笠，讓遊客感受祭典的氣勢。",
    tip:"推薦：①境內常設的裝飾山笠花車一定要近距離欣賞，細節雕工非常精緻；②被稱為「不老長壽の水」的靈泉井，傳說喝了可以延年益壽；③神社旁的「博多歷史館」可以更深入了解博多的歷史文化。"
  },
  "川端通商店街": {
    intro:"川端通商店街是博多最古老的拱廊型商店街，已有超過100年歷史，昭和懷舊氛圍濃厚，也是每年博多祇園山笠祭巨大山笠花車遊行的必經路線。商店街裡有和菓子老鋪、乾貨行跟傳統服飾店，保留了博多庶民生活的日常樣貌。",
    tip:"推薦：①川端善哉廣場的紅豆年糕湯（ぜんざい）是商店街的招牌甜點，冬天吃特別暖胃；②沿路的乾貨、佃煮老店可以買一些特色伴手禮；③商店街尾端連接著櫛田神社，可以安排順遊。"
  },
  "ららぽーと福岡": {
    intro:"ららぽーと福岡是九州規模數一數二的大型購物中心，2022年開幕後迅速成為福岡南區的購物地標，品牌組合齊全，從國際服飾、生活雜貨到親子遊樂設施應有盡有，館內動線寬敞舒適，很適合安排半天悠閒地逛。",
    tip:"推薦：①美食街匯集多元選擇，從日式定食到亞洲料理都找得到；②館內設有大型親子遊樂區，帶小孩同行也不怕無聊；③不少日本潮流品牌的九州限定店在這裡都設有分店，喜歡逛街的人可以留久一點時間。"
  },
  "太宰府天満宮": {
    intro:"太宰府天滿宮供奉學問之神菅原道真，與京都北野天滿宮、山口防府天滿宮並列日本三大天滿宮之一，每年吸引數百萬考生跟遊客前來祈求學業與事業順利。參道兩旁老字號店家林立，飄散陣陣烤麻糬的香氣，境內還保留一株傳說會朝著菅原道真流放地飛去的「飛梅」古木。",
    tip:"推薦：①名物梅枝餅（現烤紅豆餡烤餅）幾乎每間店都有自己的獨門配方，建議多比較幾家；②本殿旁的「飛梅」古木跟牛的雕像，傳說摸牛頭可以增加智慧；③境內旁的九州國立博物館可以順道參觀，館藏豐富且建築本身就很有看頭。"
  },
  "高良大社": {
    intro:"高良大社鎮座在久留米高良山山腰，是筑後國的一之宮，歷史可以追溯到飛鳥時代，現存本殿、幣殿、拜殿都被指定為日本國家重要文化財。腹地清幽，遠離市區的喧囂，從境內展望台望出去可以將整個筑後平原跟筑後川盡收眼底。",
    tip:"推薦：①正殿建築本身的雕刻工藝值得細細欣賞；②境內展望台是俯瞰久留米市區的私房景點，傍晚時分特別寧靜；③沿參道兩旁的杉木林蔭步道，散步起來相當舒服。"
  },
  "大砲ラーメン 本店 久留米": {
    intro:"大砲拉麵創業於昭和28年（1953年），是久留米豚骨拉麵的始祖級名店之一，獨門的「呼び戻し」製法讓高湯鍋數十年來從未熄火，每天只添加新湯絕不倒掉舊湯，讓豚骨精華層層堆疊出濃郁卻不死鹹的風味。本店保留開放式廚房，可以近距離看到老師傅熬湯、煮麵的過程。",
    tip:"推薦：①招牌豚骨拉麵一定要點，湯頭濃厚但收尾意外清爽；②便宜的替玉（續麵）幾乎是必點，把剩下的湯喝乾淨才是行家吃法；③久留米名物一口煎餃跟烤飯（やきめし）是很好的配菜，三樣一起點份量剛剛好。"
  },
  "長浜鮮魚市場": {
    intro:"長浜鮮魚市場位在博多灣邊，是福岡在地漁獲批發跟零售的重要據點，清晨時分最為熱鬧，市場周邊也聚集不少提供現撈海鮮的早餐食堂。這裡同時也是博多長浜拉麵的發源地，過去深夜到清晨營業的拉麵攤，曾是漁市場工作人員收工後的宵夜選擇，後來演變成博多拉麵的重要流派之一。",
    tip:"推薦：①市場周邊食堂的海鮮丼、生魚片定食是招牌，新鮮度直接來自旁邊的批發市場；②想吃拉麵的話，這裡也吃得到元祖級的長浜豚骨拉麵，湯頭偏細麵、偏清爽；③清晨時段人潮較少，適合悠閒地逛市場感受在地生活感。"
  },
  "舞鶴公園 福岡": {
    intro:"舞鶴公園緊鄰福岡城遺跡，佔地遼闊，是福岡市民日常散步、慢跑、賞花的重要綠地。春天櫻花季跟初夏的花菖蒲季是公園最熱鬧的時候，平時園內的護城河、石垣跟大片草坪也很適合悠閒散步。",
    tip:"推薦：①護城河沿岸的散步道視野開闊，適合拍攝城跡跟水景的合照；②公園內的兒童遊樂區跟運動場，是感受福岡日常生活的好地方；③可以順道走到旁邊的福岡城遺跡一起參觀，兩者步行距離很近。"
  },
  "福岡城跡": {
    intro:"福岡城是江戶時代福岡藩主黑田氏的居城，曾是九州數一數二規模的城郭，雖然天守閣已不復存在，但現存的石垣、城門跟櫓保存得相當完整，依然能感受到當年城郭的雄偉規模。近年在遺跡上重新整理步道跟解說牌，方便遊客一邊散步一邊了解城池的歷史。",
    tip:"推薦：①登上遺跡的制高點可以眺望舞鶴公園跟大濠公園的全景，是拍福岡市區風景的私房角度；②現存的多聞櫓跟石垣值得細細欣賞當年的建築工法；③傍晚時段來訪光線柔和，很適合拍照。"
  },
  "大濠公園": {
    intro:"大濠公園是仿效中國杭州西湖打造的市民公園，園內大水池環繞步道約2公里，是福岡市民日常散步、慢跑跟划船休憩的重要場所。公園周邊有不少質感咖啡廳跟餐廳，沿著湖畔散步，能感受到福岡人悠閒的生活步調。",
    tip:"推薦：①湖畔的餐廳跟咖啡廳可以邊用餐邊欣賞湖景，推薦安排在這裡吃午餐；②可以在公園租借小船，划船遊湖是很受歡迎的體驗；③沿著環湖步道散步一圈約30-40分鐘，很適合飯後消化。"
  },
  "FUK COFFEE Parks": {
    intro:"FUK COFFEE Parks是大濠公園旁的人氣咖啡廳，由福岡在地知名咖啡品牌FUK COFFEE開設的分店，主打悠閒放鬆的公園咖啡廳氛圍，店內有開放式露台座位，可以一邊喝咖啡一邊眺望戶外景色。招牌甜點「大濠布丁」口感扎實濃郁，是品牌最受歡迎的招牌商品，經常在中午前就銷售一空。",
    tip:"推薦：①招牌大濠布丁一定要點，喜歡吃甜一點可以加點一球冰淇淋；②現烤泡芙也是人氣品項，外皮酥脆內餡濃郁；③假日人潮多容易完售，建議提早前往或先透過Instagram私訊預約。"
  },
  "宮地嶽神社": {
    intro:"宮地嶽神社主殿前懸掛的巨大注連繩重達3噸、長11公尺，是日本規模數一數二的注連繩，氣勢驚人。神社的參道正對著西邊的海與夕陽，每年僅有2月跟10月各一段時間，夕陽會剛好落在參道正中央、沉入海平線，被稱為「光之道」，是攝影愛好者專程前來取景的知名景點。",
    tip:"推薦：①巨大注連繩一定要近距離感受它的震撼氣勢；②境內的松ヶ枝餅（類似太宰府梅枝餅的烤餅）是必吃的參拜點心；③參道商店街也有不少海產乾貨跟伴手禮店，可以順道採買。"
  },
  "呼子朝市": {
    intro:"呼子朝市號稱日本三大朝市之一，已有超過百年歷史，每天早上7:30到中午，松浦町商店街兩側會擺出滿滿的海鮮、蔬果攤販，漁婦們一邊叫賣一邊招呼客人試吃，充滿濃厚的漁港生活氣息。呼子最著名的就是新鮮的劍先魷魚，店家經常在店門口的水槽現場撈捕現殺，鮮度直接反映在餐桌上。",
    tip:"推薦：①呼子名物劍先魷魚活造り一定要嘗試，現點現切的生魚片透明QQ、口感清甜；②吃完活造り剩下的魷魚腳可以請店家加點炸物或塩烤，一魚兩吃不浪費；③朝市裡的魷魚乾貨、魷魚黑輪等小吃很適合邊走邊吃當點心。"
  },
  "七ツ釜 佐賀県": {
    intro:"七ツ釜是玄界灘海浪長年侵蝕唐津海岸形成的七個海蝕洞，洞穴最大可以容納小船進入探索，壯闊的柱狀玄武岩斷崖是日本國家指定名勝天然紀念物。從陸地上的展望台可以遠眺整片海蝕地形，想更近距離感受的話也可以搭乘觀光遊覽船從海上直接開進洞穴。",
    tip:"推薦：①天氣許可時建議搭乘觀光遊覽船，近距離感受海蝕洞的壯觀規模；②岸邊的展望台步道可以慢慢散步，沿途眺望玄界灘海岸線；③喜歡拍照的話，傍晚光線角度會讓斷崖的層次感更明顯。"
  },
  "虹の松原": {
    intro:"虹之松原與靜岡三保松原、福井氣比松原並列日本三大松原，沿著唐津灣海岸線綿延約4.5公里、寬約500公尺，種植超過100萬棵黑松，是江戶時代唐津藩主為了防風防砂而人工栽種，如今已成為國家特別名勝。松林間的步道濃蔭遮蔽，即使夏天也相對涼爽。",
    tip:"推薦：①沿著松林步道散步透氣，是體驗唐津海岸線最愜意的方式；②傍晚時分陽光穿過松林灑落地面的畫面很值得拍照留念；③松原沿線也有幾處可以眺望唐津灣海景的小出口，適合稍作停留。"
  },
  "鏡山展望台 唐津": {
    intro:"鏡山又稱「領巾振山」，因古代傳說一位女子在山頂揮動領巾為遠行的愛人送別而得名。山頂設有展望台，視野極佳，可以將唐津市區、虹之松原的松林帶跟唐津灣的海岸線盡收眼底，是俯瞰唐津全景最具代表性的制高點。",
    tip:"推薦：①天氣晴朗時可以同時看到唐津城跟整片虹之松原海岸線，拍全景照最理想；②山頂設有休息設施，可以稍作停留欣賞風景；③傍晚前來能看到夕陽灑在唐津灣上的景色，光線特別柔和。"
  },
  "唐津城": {
    intro:"唐津城建於慶長年間（1602年開始興建），面朝唐津灣而建，因城郭外型優美、彷彿展翅的鶴而被稱為「舞鶴城」。現在的天守閣為後世重建，內部規劃為展望台跟歷史資料館，可以了解唐津藩的歷史沿革跟城郭建築工法。",

function renderRow(item){
  if(item.type==="section"){
    return `<div class="section-label">${item.label}</div>`;
  }
  if(item.type==="note"){
    return `<div class="row"><div class="note">${item.text}</div></div>`;
  }
  if(item.type==="activity"){
    const ic = (TAG[item.tag]||{icon:"・"}).icon;
    const mapUrl = item.map ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.map)}` : "";
    const mapLink = mapUrl ? `<a class="maplink" href="${mapUrl}" target="_blank" rel="noopener">📍 地圖</a>` : "";
    const info = item.map ? INFO[item.map] : null;
    const detail = info ? `<div class="activity-detail">
        <p>${info.intro}</p>
        <p class="tip">${info.tip}</p>
      </div>` : "";
    const clickable = info ? " clickable" : "";
    const chevron = info ? `<span class="chevron">▾</span>` : "";
    return `<div class="row">
      <span class="dot" style="background:var(--accent)"></span>
      <div class="activity${clickable}">
        <div class="activity-head">
          <span class="ic">${ic}</span>
          <div class="txt">${item.text}${item.time? `<span class="time">${item.time}</span>`:""}${mapLink}</div>
          ${chevron}
        </div>
        ${detail}
      </div>
    </div>`;
  }
  // transit
  const m = MODE[item.mode] || MODE.rail;
  const chips = [];
  if(item.price) chips.push(`<span class="chip price">${item.price}</span>`);
  if(item.transfer) chips.push(`<span class="chip transfer">${item.transfer}</span>`);
  const timeFrom = item.ft ? `<span class="time">${item.ft}</span>` : "";
  const timeTo = item.tt ? `<span class="time">${item.tt}</span>` : "";
  return `<div class="row">
    <span class="dot" style="background:${m.color}"></span>
    <div class="transit">
      <div class="leg">
        <span class="stop">${item.from}${timeFrom? " "+timeFrom : ""}</span>
        <span class="mid"><span>${m.icon}</span><span class="arrow">─────▶</span></span>
        <span class="stop">${item.to}${timeTo? " "+timeTo : ""}</span>
      </div>
      <div class="meta">
        <span class="chip line-tag" style="color:${m.color}">${item.line}</span>
        ${chips.join("")}
      </div>
    </div>
  </div>`;
}

function buildPage(day, idx){
  const rows = day.items.map(renderRow).join("");
  return `<section class="day-page" id="day-${idx}">
    <div class="day-head">

      <div class="dmeta">

}

function dayStops(day){
  const stops = [];
  const push = (name)=>{
    const c = COORDS[name];
    if(!c) return;
    const last = stops[stops.length-1];
    if(last){
      const dLat = last.lat - c[0], dLng = last.lng - c[1];
      const closeEnough = Math.sqrt(dLat*dLat + dLng*dLng) < 0.003; // ~300m
      if(last.name===name || closeEnough) return;
    }
    stops.push({name, lat:c[0], lng:c[1]});
  };
  day.items.forEach(item=>{
    if(item.type==="transit"){ push(item.from); push(item.to); }
    else if(item.type==="activity" && item.map){ push(item.map); }
  });
  return stops;
}

const dayMaps = {}; // idx -> leaflet map instance

function buildDayMap(idx){
  if(dayMaps[idx]) { dayMaps[idx].invalidateSize(); return; }
  const el = document.getElementById("daymap-"+idx);
  if(!el) return;
  const stops = dayStops(days[idx]);
  if(stops.length < 2){ el.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-size:12px;">（無足夠地點資料）</div>`; return; }

  // when the same spot is revisited later that day, nudge it outward a little
  // so the pin doesn't sit exactly on top of the earlier visit and hide its number
  const seen = {};
  stops.forEach(s=>{
    const key = s.lat.toFixed(4)+","+s.lng.toFixed(4);
    const count = seen[key] || 0;
    seen[key] = count + 1;
    if(count > 0){
      const angle = count * 2.4; // golden-angle-ish spiral
      const radius = 0.0007 * count;
      s.lat += radius * Math.cos(angle);
      s.lng += radius * Math.sin(angle) / Math.cos(s.lat * Math.PI/180);
    }
  });

  const isKaratsu = idx >= 5;
  const color = isKaratsu ? "#1B5E8C" : "#BF3B26";

  const map = L.map(el, {
    scrollWheelZoom:true,
    doubleClickZoom:true,
    touchZoom:true,
    boxZoom:true,
    keyboard:true,
    zoomControl:true
  }).setView([stops[0].lat, stops[0].lng], 11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);

  const latlngs = stops.map(s=>[s.lat,s.lng]);
  L.polyline(latlngs, {color, weight:3, opacity:0.85}).addTo(map);

  // direction arrows at the midpoint of each leg, pointing from stop i to stop i+1
  for(let i=0;i<stops.length-1;i++){
    const a = stops[i], b = stops[i+1];
    const midLat = (a.lat+b.lat)/2, midLng = (a.lng+b.lng)/2;
    const angle = Math.atan2(b.lng-a.lng, b.lat-a.lat) * 180/Math.PI;
    const arrowIcon = L.divIcon({
      className:"",
      html:`<div class="dayarrow" style="color:${color};transform:rotate(${angle}deg)">▲</div>`,
      iconSize:[16,16], iconAnchor:[8,8]
    });
    L.marker([midLat,midLng], {icon:arrowIcon, interactive:false}).addTo(map);
  }

  stops.forEach((s,i)=>{
    const isStart = i===0, isEnd = i===stops.length-1;
    const ring = isStart ? "0 0 0 3px #2F8F4E, 0 1px 4px rgba(0,0,0,.35)" : isEnd ? "0 0 0 3px #B8935A, 0 1px 4px rgba(0,0,0,.35)" : "0 1px 4px rgba(0,0,0,.35)";
    const size = (isStart||isEnd) ? 28 : 24;
    const icon = L.divIcon({
      className:"",
      html:`<div class="daypin" style="background:${color};width:${size}px;height:${size}px;box-shadow:${ring}">${isStart?"起":isEnd?"終":i+1}</div>`,
      iconSize:[size,size], iconAnchor:[size/2,size/2]
    });
    const label = isStart ? `起點：${s.name}` : isEnd ? `終點：${s.name}` : `${i+1}. ${s.name}`;
    L.marker([s.lat,s.lng], {icon}).addTo(map).bindPopup(`<span class="day-popup">${label}</span>`);
  });

  map.fitBounds(latlngs, {padding:[24,24]});
  dayMaps[idx] = map;
}

function activatePage(page, {jump=true}={}){
  const btn = document.querySelector(`.daytab[data-page="${page}"]`);
  const el = page==="packing" ? document.getElementById("page-packing") : document.getElementById("day-"+page);
  if(!btn || !el) return;
  document.querySelectorAll(".daytab").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".day-page").forEach(p=>p.classList.remove("active"));
  btn.classList.add("active");
  el.classList.add("active");
  if(page!=="packing") buildDayMap(Number(page));
  btn.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
  if(jump) window.scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("dayNav").addEventListener("click",(e)=>{
  const btn = e.target.closest(".daytab");
  if(!btn) return;
  activatePage(btn.dataset.page);
});

// ---- Packing list persistence ----
const PACK_KEY = "kyushu-packing-v1";
function loadPackState(){
  try{ return JSON.parse(localStorage.getItem(PACK_KEY)) || {}; }catch(e){ return {}; }
}
function savePackState(state){
  try{ localStorage.setItem(PACK_KEY, JSON.stringify(state)); }catch(e){}
}
function refreshPackProgress(){
  const boxes = document.querySelectorAll("#page-packing input[type=checkbox]");
  const total = boxes.length;
  const checked = document.querySelectorAll("#page-packing input[type=checkbox]:checked").length;
  const fill = document.getElementById("packFill");
  const count = document.getElementById("packCount");
  if(fill) fill.style.width = (total? (checked/total*100) : 0) + "%";
  if(count) count.textContent = checked + " / " + total;
}
(function initPacking(){
  const state = loadPackState();
  document.querySelectorAll("#page-packing input[type=checkbox]").forEach(box=>{
    const key = box.dataset.key;
    if(state[key]) box.checked = true;
    box.addEventListener("change", ()=>{
      const s = loadPackState();
      s[key] = box.checked;
      savePackState(s);
      box.closest(".pack-item").classList.toggle("done", box.checked);
      refreshPackProgress();
    });
    if(box.checked) box.closest(".pack-item").classList.add("done");
  });
  document.querySelectorAll("#page-packing .pack-link").forEach(a=>{
    a.addEventListener("click", e=>e.stopPropagation());
  });
  refreshPackProgress();
  const resetBtn = document.getElementById("packReset");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{
    savePackState({});
    document.querySelectorAll("#page-packing input[type=checkbox]").forEach(box=>{
      box.checked = false;
      box.closest(".pack-item").classList.remove("done");
    });
    refreshPackProgress();
  });
})();

function pageFromHash(){
  const m = location.hash.match(/day-(\d+)/);
  return location.hash === "#packing" ? "packing" : (m ? m[1] : 0);
}
activatePage(pageFromHash(), {jump:false});
window.addEventListener("hashchange", ()=> activatePage(pageFromHash()));
