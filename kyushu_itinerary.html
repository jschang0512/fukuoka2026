<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九州行程表｜福岡・北九州・唐津・佐賀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A44;
    --ink-soft:#4A5568;
    --paper:#F1F3F6;
    --card:#FFFFFF;
    --line:#D8DEE6;
    --accent:#BF3B26;      /* torii vermillion - meals / highlight */
    --gold:#B8935A;        /* cable/slope, price chips */
    --rail:#8C2A2A;        /* train lines */
    --bus:#3E7C59;         /* bus */
    --boat:#0E7C86;        /* ferry */
    --cable:#B8935A;       /* cablecar / slopecar */
    --walk:#8A8A8A;        /* on foot */
    --car:#6B4C9A;         /* taxi / rental car */
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans TC","Hiragino Sans",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"JetBrains Mono",monospace;}
  .display{font-family:"Shippori Mincho",serif;}

  /* ---------- Header ---------- */
  header.hero{
    background:
      radial-gradient(1200px 300px at 10% -20%, rgba(191,59,38,0.18), transparent 60%),
      linear-gradient(180deg,#1B2A44 0%, #223457 100%);
    color:#F1F3F6;
    padding:34px 20px 22px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header.hero::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 18px, transparent 18px 30px);
    opacity:.7;
  }
  .eyebrow{
    letter-spacing:.35em;
    font-size:11px;
    text-transform:uppercase;
    color:#C9CFDA;
    margin-bottom:10px;
    font-family:"JetBrains Mono",monospace;
  }
  h1.title{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:clamp(28px,6vw,42px);
    margin:0 0 6px;
    letter-spacing:.04em;
  }
  .subtitle{
    color:#C9CFDA;
    font-size:14px;
    margin:0;
  }
  .route-strip{
    margin-top:18px;
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:#F1F3F6;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    display:inline-flex;
    gap:8px;
    padding:6px 14px;
    border-radius:999px;
    flex-wrap:wrap;
    justify-content:center;
  }

  /* ---------- Day nav ---------- */
  nav.daynav{
    position:sticky; top:0; z-index:20;
    background:#1B2A44;
    display:flex;
    overflow-x:auto;
    padding:0 6px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    scrollbar-width:none;
  }
  nav.daynav::-webkit-scrollbar{display:none;}
  .daytab{
    flex:0 0 auto;
    background:transparent;
    border:none;
    color:#9AA6BC;
    padding:12px 16px 10px;
    cursor:pointer;
    text-align:center;
    border-bottom:3px solid transparent;
    font-family:"Noto Sans TC",sans-serif;
    position:relative;
  }
  .daytab .num{
    display:block;
    font-family:"JetBrains Mono",monospace;
    font-size:10px;
    letter-spacing:.1em;
    color:#7E8AA3;
  }
  .daytab .lbl{
    display:block;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    margin-top:2px;
  }
  .daytab.active{
    color:#fff;
    border-bottom-color:var(--accent);
  }
  .daytab.active .num{color:var(--accent);}
  .daytab:hover{color:#fff;}

  /* ---------- Legend ---------- */
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
    padding:14px 16px 4px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* ---------- Day page ---------- */
  main{max-width:640px; margin:0 auto; padding:18px 16px 60px;}
  .day-page{display:none;}
  .day-page.active{display:block; animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .day-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin:6px 0 18px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
  }
  .day-head .dnum{
    font-family:"Shippori Mincho",serif;
    font-size:34px;
    font-weight:700;
    color:var(--accent);
    line-height:1;
  }
  .day-head .dmeta{flex:1;}
  .day-head .ddate{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .day-head .dtitle{
    font-size:19px;
    font-weight:700;
    margin-top:2px;
  }

  /* timeline */
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{
    content:"";
    position:absolute; left:9px; top:6px; bottom:6px; width:2px;
    background:var(--line);
  }
  .row{position:relative; margin-bottom:14px;}
  .row .dot{
    position:absolute; left:-26px; top:5px;
    width:11px; height:11px; border-radius:50%;
    border:2px solid var(--card);
    box-shadow:0 0 0 1.5px var(--line);
  }

  /* transit card */
  .transit{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:10px 14px;
    box-shadow:0 1px 2px rgba(27,42,68,.04);
  }
  .transit .leg{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:13.5px;
  }
  .transit .stop{font-weight:700;}
  .transit .time{font-family:"JetBrains Mono",monospace; color:var(--ink-soft); font-size:12.5px;}
  .transit .mid{
    display:flex; align-items:center; gap:6px;
    flex:1; justify-content:center; min-width:60px;
    color:var(--ink-soft); font-size:12px;
  }
  .transit .mid .arrow{color:var(--line);}
  .transit .meta{
    display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;
  }
  .chip{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
    background:#F1F3F6;
    color:var(--ink-soft);
    border:1px solid var(--line);
  }
  .chip.price{color:#8a6a1f; border-color:#e6d5ad; background:#FBF4E4;}
  .chip.transfer{color:var(--accent); border-color:#f0c9bf; background:#FBEDE9;}
  .line-tag{
    font-size:12px; font-weight:700;
  }

  /* activity card */
  .activity{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .activity .num{
    font-family:"Shippori Mincho",serif;
    font-weight:700;
    font-size:16px;
    color:var(--accent);
    width:20px;
    flex:0 0 auto;
  }
  .activity .ic{font-size:18px; flex:0 0 auto;}
  .activity .txt{font-size:14.5px; font-weight:500; line-height:1.5;}
  .activity .txt .time{
    font-family:"JetBrains Mono",monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-left:6px;
  }

  /* note / info card */
  .note{
    background:#FBF4E4;
    border:1px dashed #D9BE85;
    border-radius:var(--radius);
    padding:10px 14px;
    font-size:13px;
    color:#6b5316;
  }
  .note b{color:#4a3a10;}

  .section-label{
    font-family:"JetBrains Mono",monospace;
    font-size:10.5px;
    letter-spacing:.15em;
    color:#9AA6BC;
    text-transform:uppercase;
    margin:22px 0 8px 0;
  }
  .row:first-child .section-label{margin-top:0;}

  footer{
    text-align:center;
    padding:20px;
    font-size:11px;
    color:#9AA6BC;
    font-family:"JetBrains Mono",monospace;
  }

  @media(max-width:420px){
    .transit .leg{flex-direction:row; font-size:12.5px;}
    .transit .stop{max-width:34%;}
  }
</style>
</head>

    T("rail","江北車站","13:49","武雄温泉車站","14:06","JR 佐世保線（往早岐）","¥660"),
    A("onsen","武雄温泉"),
    S("移動：武雄溫泉 → 佐賀"),
    T("rail","武雄温泉車站","17:19","江北車站","17:36","JR 佐世保線（往江北）","","換乘 5→3"),
    T("rail","江北車站","17:52","佐賀車站","18:14","JR 長崎本線（往福間）","¥660")
  ]
},
{
  date:"8/25（二）", theme:"佐賀・返程", route:"佐賀車站 → 佐賀機場",

    T("bus","佐賀車站","09:10","佐賀機場","09:40","佐賀空港接続バス","¥600"),

  ]

function renderRow(item){
  if(item.type==="section"){
    return `<div class="section-label">${item.label}</div>`;
  }
  if(item.type==="note"){
    return `<div class="row"><div class="note">${item.text}</div></div>`;
  }
  if(item.type==="activity"){
    const ic = (TAG[item.tag]||{icon:"・"}).icon;
    return `<div class="row">
      <span class="dot" style="background:var(--accent)"></span>
      <div class="activity">
        <span class="ic">${ic}</span>
        <div class="txt">${item.text}${item.time? `<span class="time">${item.time}</span>`:""}</div>
      </div>
    </div>`;
  }
  // transit
  const m = MODE[item.mode] || MODE.rail;
  const chips = [];
  if(item.price) chips.push(`<span class="chip price">${item.price}</span>`);
  if(item.transfer) chips.push(`<span class="chip transfer">${item.transfer}</span>`);
  const timeFrom = item.ft ? `<span class="time">${item.ft}</span>` : "";
  const timeTo = item.tt ? `<span class="time">${item.tt}</span>` : "";
  return `<div class="row">
    <span class="dot" style="background:${m.color}"></span>
    <div class="transit">
      <div class="leg">
        <span class="stop">${item.from}${timeFrom? " "+timeFrom : ""}</span>
        <span class="mid"><span>${m.icon}</span><span class="arrow">─────▶</span></span>
        <span class="stop">${item.to}${timeTo? " "+timeTo : ""}</span>
      </div>
      <div class="meta">
        <span class="chip line-tag" style="color:${m.color}">${item.line}</span>
        ${chips.join("")}
      </div>
    </div>
  </div>`;
}

function buildPage(day, idx){
  const rows = day.items.map(renderRow).join("");
  return `<section class="day-page" id="day-${idx}">
    <div class="day-head">
      <div class="dnum mono">${String(idx+1).padStart(2,"0")}</div>
      <div class="dmeta">
        <div class="ddate">${day.date}</div>
        <div class="dtitle">${day.theme}</div>
      </div>
    </div>
    <div class="timeline">${rows}</div>
  </section>`;
}

function buildNav(){
  return days.map((d,i)=>`
    <button class="daytab${i===0?" active":""}" data-idx="${i}">
      <span class="num">DAY ${String(i+1).padStart(2,"0")}</span>
      <span class="lbl">${d.theme}</span>
    </button>`).join("");
}

function buildRouteStrip(){
  return days.map((d,i)=>`<span>${i+1}. ${d.theme}</span>`).join("<span style='opacity:.4'>／</span>");
}

const main = document.getElementById("main");
main.innerHTML = days.map(buildPage).join("");
document.getElementById("dayNav").innerHTML = buildNav();
document.getElementById("routeStrip").innerHTML = buildRouteStrip();

document.querySelectorAll(".day-page")[0].classList.add("active");

document.getElementById("dayNav").addEventListener("click",(e)=>{
  const btn = e.target.closest(".daytab");
  if(!btn) return;
  const idx = btn.dataset.idx;
  document.querySelectorAll(".daytab").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".day-page").forEach(p=>p.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("day-"+idx).classList.add("active");
  btn.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
  window.scrollTo({top:0, behavior:"smooth"});
});
</script>
</body>
