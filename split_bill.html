<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九州旅費分帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Sans+TC:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ============================================================
     設定區：換成你自己 Supabase 專案的 URL 跟 anon public key
     （Supabase Dashboard → Project Settings → API）
     成員清單的 email 要跟你在 Supabase Auth 建立帳號時用的一致
     ============================================================ */
  body{ background:var(--paper); }
  .wrap{ max-width:560px; margin:0 auto; padding:24px 16px 60px; }
  .app-header{
    text-align:center;
    padding:26px 16px 20px;
    margin-bottom:20px;
  }
  .app-header .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .app-header h1{
    font-family:"Shippori Mincho",serif;
    font-size:28px;
    margin:0;
    color:var(--ink);
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(36,32,36,.06);
  }
  .card h2{
    font-family:"Shippori Mincho",serif;
    font-size:16px;
    margin:0 0 14px;
    color:var(--ink);
  }
  label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:12px 0 5px;
    font-weight:700;
  }
  label:first-of-type{ margin-top:0; }
  select, input[type=text], input[type=password], input[type=number], input[type=date]{
    width:100%;
    font-family:"Noto Sans TC",sans-serif;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    color:var(--ink);
    box-sizing:border-box;
  }
  select:focus, input:focus{ outline:none; border-color:var(--accent); }
  .checks{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .check-pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 12px;
    font-size:12.5px;
    cursor:pointer;
    user-select:none;
  }
  .check-pill input{ width:auto; accent-color:var(--accent); }
  .check-pill.checked{ border-color:var(--accent); background:#F5EEF0; }
  :root[data-theme="dark"] .check-pill.checked{ background:#2A2A2A; }

  .btn{
    display:inline-block;
    width:100%;
    text-align:center;
    background:var(--btn-solid);
    color:var(--btn-solid-fg);
    border:none;
    font-family:"Noto Sans TC",sans-serif;
    font-size:14px;
    font-weight:700;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    margin-top:16px;
  }
  .btn:active{ transform:scale(.98); }
  .btn.secondary{
    background:var(--card);
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.small{ width:auto; padding:7px 14px; font-size:12.5px; margin-top:0; }
  .btn:disabled{ opacity:.5; cursor:default; }

  .msg{ font-size:12.5px; margin-top:10px; text-align:center; }
  .msg.error{ color:#B33F3F; }
  .msg.ok{ color:#2F8F4E; }

  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .topbar .whoami{ flex:1; font-size:13.5px; color:var(--ink-soft); }
  .topbar .whoami b{ color:var(--ink); }

  .exp-item{
    display:flex;
    gap:10px;
    padding:12px 0;
    border-top:1px solid var(--line);
  }
  .exp-item:first-child{ border-top:none; }
  .exp-item .exp-main{ flex:1; min-width:0; }
  .exp-item .exp-desc{ font-size:14px; font-weight:700; color:var(--ink); }
  .exp-item .exp-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; line-height:1.6; }
  .exp-item .exp-amt{ flex:0 0 auto; font-family:"JetBrains Mono",monospace; font-weight:700; color:var(--accent-text); font-size:15px; }
  .exp-del{ flex:0 0 auto; background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:0 2px; }

  .balance-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 0;
    border-top:1px solid var(--line);
    font-size:13.5px;
  }
  .balance-row:first-child{ border-top:none; }
  .balance-row .amt.pos{ color:#2F8F4E; font-weight:700; font-family:"JetBrains Mono",monospace; }
  .balance-row .amt.neg{ color:#B33F3F; font-weight:700; font-family:"JetBrains Mono",monospace; }
  .balance-row .amt.zero{ color:var(--ink-soft); font-family:"JetBrains Mono",monospace; }

  .settle-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    background:var(--paper);
    border-radius:10px;
    margin-bottom:8px;
    font-size:13.5px;
  }
  .settle-clickable{ cursor:pointer; border:1px solid transparent; transition:border-color .15s ease, transform .1s ease; }
  .settle-clickable:hover{ border-color:var(--accent); }
  .settle-clickable:active{ transform:scale(.98); }
  .settle-item b{ color:var(--ink); }
  .settle-item .arrow{ color:var(--ink-soft); }
  .settle-item .amt{ margin-left:auto; font-family:"JetBrains Mono",monospace; font-weight:700; color:var(--accent-text); }
  .settle-empty{ font-size:13px; color:var(--ink-soft); text-align:center; padding:10px 0; }

  #loginScreen{ display:none; }

  .my-balance{
    position:sticky;
    top:8px;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--btn-solid);
    color:var(--btn-solid-fg);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:14px;
    box-shadow:0 6px 18px rgba(36,32,36,.18);
  }
  .my-balance-label{ font-size:12px; opacity:.75; }
  .my-balance-amt{
    font-family:"JetBrains Mono",monospace;
    font-size:20px;
    font-weight:700;
  }
  .my-balance-amt.pos{ color:#7FD99A; }
  .my-balance-amt.neg{ color:#FF9A9A; }
  .my-balance-amt.zero{ color:var(--btn-solid-fg); }

  .app-tabs{
    display:flex;
    gap:6px;
    margin-bottom:16px;
  }
  .app-tab{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 6px;
    font-family:"Noto Sans TC",sans-serif;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .app-tab.active{
    background:var(--btn-solid);
    color:var(--btn-solid-fg);
    border-color:var(--btn-solid);
  }
  .app-panel{ display:none; }
  .app-panel.active{ display:block; }
  #appScreen{ display:none; }
  .hidden{ display:none !important; }

  .link-btn{ background:none; border:none; color:var(--accent-text); font-size:12.5px; cursor:pointer; text-decoration:underline; padding:0; }
</style>
</head>
<body>

<div class="wrap">
  <div class="app-header">
    <div class="eyebrow">KYUSHU TRIP · SPLIT BILL</div>
    <h1>九州旅費分帳</h1>
  </div>

  <!-- 設定不完整時顯示 -->
  <div id="configWarning" class="card hidden">
    <h2>⚠️ 尚未設定 Supabase</h2>
    <p style="font-size:13px; color:var(--ink-soft); line-height:1.7;">
      打開這個檔案，把最下面 <code>&lt;script&gt;</code> 區塊裡的
      <code>SUPABASE_URL</code> 跟 <code>SUPABASE_ANON_KEY</code>
      換成你自己 Supabase 專案的值，存檔後重新整理即可。
    </p>
  </div>

  <!-- 登入畫面 -->
  <div id="loginScreen" class="card">
    <h2>🔒 登入</h2>
    <label>選擇你的名字</label>
    <select id="loginName"></select>
    <label>密碼<span style="font-weight:400;color:var(--ink-soft);">（預設是生日 8 碼，例如 20031231）</span></label>
    <input type="password" id="loginPassword" placeholder="輸入密碼">
    <button class="btn" id="loginBtn">登入</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- 主畫面 -->
  <div id="appScreen">
    <div class="topbar">
      <div class="whoami">登入身份：<b id="whoamiName"></b></div>
      <button class="btn secondary small" id="changePwBtn">變更密碼</button>
      <button class="btn secondary small" id="logoutBtn">登出</button>
    </div>

    <!-- 變更密碼 -->
    <div class="card hidden" id="changePwCard">
      <h2>🔑 變更密碼</h2>
      <label>新密碼（至少 6 碼）</label>
      <input type="password" id="newPassword">
      <button class="btn" id="savePwBtn">儲存新密碼</button>
      <button class="link-btn" id="cancelPwBtn" style="margin-top:10px;">取消</button>
      <div class="msg" id="pwMsg"></div>
    </div>

    <!-- 固定顯示：我目前該收/該付多少錢 -->
    <div class="my-balance" id="myBalance">
      <div class="my-balance-label">我的餘額</div>
      <div class="my-balance-amt" id="myBalanceAmt">—</div>
    </div>

    <!-- 分頁籤 -->
    <div class="app-tabs">
      <button type="button" class="app-tab active" data-tab="expense">➕ 支出</button>
      <button type="button" class="app-tab" data-tab="repay">💸 還款</button>
      <button type="button" class="app-tab" data-tab="history">📋 記錄</button>
      <button type="button" class="app-tab" data-tab="summary">📊 總表</button>
    </div>

    <!-- 支出 -->
    <div class="app-panel active" id="panelExpense">
      <div class="card">
        <h2>➕ 新增支出</h2>
        <label>金額（日圓）</label>
        <input type="number" id="expAmount" placeholder="例如 3200" min="1" step="1">
        <label>項目說明</label>
        <input type="text" id="expDesc" placeholder="例如 博多晚餐、租車油錢">
        <label>誰先付的錢</label>
        <select id="expPaidBy"></select>
        <label>大家一起分攤（沒勾到的人不用分這筆）</label>
        <div class="checks" id="expParticipants"></div>
        <label>日期</label>
        <input type="date" id="expDate">
        <button class="btn" id="addExpenseBtn">加入這筆支出</button>
        <div class="msg" id="expMsg"></div>
      </div>
    </div>

    <!-- 還款 -->
    <div class="app-panel" id="panelRepay">
      <div class="card">
        <h2>🤝 建議還款方式</h2>
        <div id="settleList"></div>
        <p style="font-size:11.5px; color:var(--ink-soft); margin:10px 0 0;">點下面某一筆會自動幫你填好下面的還款表單</p>
      </div>
      <div class="card">
        <h2>💸 記錄還款</h2>
        <label>誰付錢</label>
        <select id="repayFrom"></select>
        <label>誰收錢</label>
        <select id="repayTo"></select>
        <label>金額（日圓）</label>
        <input type="number" id="repayAmount" placeholder="例如 1500" min="1" step="1">
        <label>備註（選填）</label>
        <input type="text" id="repayNote" placeholder="例如 現金當面給、轉帳">
        <label>日期</label>
        <input type="date" id="repayDate">
        <button class="btn" id="addRepaymentBtn">記錄這筆還款</button>
        <div class="msg" id="repayMsg"></div>
      </div>
    </div>

    <!-- 記錄 -->
    <div class="app-panel" id="panelHistory">
      <div class="card">
        <h2>📋 支出紀錄</h2>
        <div id="expenseHistory"></div>
      </div>
      <div class="card">
        <h2>💵 還款紀錄</h2>
        <div id="repaymentHistory"></div>
      </div>
    </div>

    <!-- 總表 -->
    <div class="app-panel" id="panelSummary">
      <div class="card">
        <h2>💰 目前餘額</h2>
        <div id="balanceList"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   設定：換成你自己 Supabase 專案的值
   （Supabase Dashboard → Project Settings → API 可以找到）
   ============================================================ */
const SUPABASE_URL = "https://ofevarwtqzvzrvhbanmf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pWT6foelsonrb1sLMXhnCw_oA3ytvaX";

/* 成員清單 — email 要跟你在 Supabase Auth 建立帳號時用的一致，
   建立帳號的步驟請看 supabase_schema.sql 檔案最下面的說明 */
const MEMBERS = [
  { name:"張家菘", email:"js.chang0512@gmail.com" },
  { name:"王浩恩", email:"iceharvey2003@gmail.com" },
  { name:"吳建豐", email:"jianfeng@kyushu-trip.local" },
  { name:"蕭名燁", email:"benny2003511@gmail.com" },
  { name:"呂乙宸", email:"yichenlu89@gmail.com" },
  { name:"廖昱翔", email:"gosean1125@gmail.com" }
];
</script>
<script>
(function(){
  if(SUPABASE_URL.startsWith("YOUR_") || SUPABASE_ANON_KEY.startsWith("YOUR_")){
    document.getElementById("configWarning").classList.remove("hidden");
    return;
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;      // supabase auth user object
  let memberRows = [];         // [{id, name}] from the members table
  let memberById = {};         // id -> name

  const loginScreen = document.getElementById("loginScreen");
  const appScreen = document.getElementById("appScreen");
  const loginNameSel = document.getElementById("loginName");
  const loginPwInput = document.getElementById("loginPassword");
  const loginMsg = document.getElementById("loginMsg");

  MEMBERS.forEach(m=>{
    const opt = document.createElement("option");
    opt.value = m.email; opt.textContent = m.name;
    loginNameSel.appendChild(opt);
  });

  function emailToName(email){
    const m = MEMBERS.find(x=>x.email === email);
    return m ? m.name : email;
  }

  // ---------- login / logout / change password ----------
  document.getElementById("loginBtn").addEventListener("click", async ()=>{
    const email = loginNameSel.value;
    const password = loginPwInput.value;
    if(!password){ loginMsg.textContent = "請輸入密碼"; loginMsg.className="msg error"; return; }
    loginMsg.textContent = "登入中…"; loginMsg.className = "msg";
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      loginMsg.textContent = "帳號或密碼不對，再試一次";
      loginMsg.className = "msg error";
      return;
    }
    loginMsg.textContent = "";
    await onLoggedIn(data.user);
  });

  document.getElementById("logoutBtn").addEventListener("click", async ()=>{
    await sb.auth.signOut();
    location.reload();
  });

  document.querySelectorAll(".app-tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll(".app-tab").forEach(t=>t.classList.remove("active"));
      document.querySelectorAll(".app-panel").forEach(p=>p.classList.remove("active"));
      tab.classList.add("active");
      const panelId = "panel" + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1);
      const panel = document.getElementById(panelId);
      if(panel) panel.classList.add("active");
    });
  });

  document.getElementById("changePwBtn").addEventListener("click", ()=>{
    document.getElementById("changePwCard").classList.remove("hidden");
  });
  document.getElementById("cancelPwBtn").addEventListener("click", ()=>{
    document.getElementById("changePwCard").classList.add("hidden");
  });
  document.getElementById("savePwBtn").addEventListener("click", async ()=>{
    const pw = document.getElementById("newPassword").value;
    const msg = document.getElementById("pwMsg");
    if(!pw || pw.length < 6){ msg.textContent = "密碼至少要 6 碼"; msg.className="msg error"; return; }
    const { error } = await sb.auth.updateUser({ password: pw });
    if(error){ msg.textContent = "更新失敗：" + error.message; msg.className = "msg error"; return; }
    msg.textContent = "密碼已更新！"; msg.className = "msg ok";
    document.getElementById("newPassword").value = "";
    setTimeout(()=> document.getElementById("changePwCard").classList.add("hidden"), 1200);
  });

  // ---------- main app ----------
  async function onLoggedIn(user){
    currentUser = user;
    loginScreen.style.display = "none";
    appScreen.style.display = "block";

    const { data: members } = await sb.from("members").select("id,name");
    memberRows = members || [];
    memberById = {};
    memberRows.forEach(m => memberById[m.id] = m.name);

    document.getElementById("whoamiName").textContent = memberById[user.id] || emailToName(user.email);

    // paid-by select
    const paidBySel = document.getElementById("expPaidBy");
    paidBySel.innerHTML = "";
    memberRows.forEach(m=>{
      const opt = document.createElement("option");
      opt.value = m.id; opt.textContent = m.name;
      if(m.id === user.id) opt.selected = true;
      paidBySel.appendChild(opt);
    });

    // participants checkboxes (default all checked)
    const partWrap = document.getElementById("expParticipants");
    partWrap.innerHTML = "";
    memberRows.forEach(m=>{
      const label = document.createElement("label");
      label.className = "check-pill checked";
      label.innerHTML = `<input type="checkbox" value="${m.id}" checked> ${m.name}`;
      label.querySelector("input").addEventListener("change", (e)=>{
        label.classList.toggle("checked", e.target.checked);
      });
      partWrap.appendChild(label);
    });

    document.getElementById("expDate").value = new Date().toISOString().slice(0,10);

    // repayment from/to selects
    const repayFromSel = document.getElementById("repayFrom");
    const repayToSel = document.getElementById("repayTo");
    repayFromSel.innerHTML = ""; repayToSel.innerHTML = "";
    memberRows.forEach(m=>{
      const o1 = document.createElement("option");
      o1.value = m.id; o1.textContent = m.name;
      if(m.id === user.id) o1.selected = true;
      repayFromSel.appendChild(o1);

      const o2 = document.createElement("option");
      o2.value = m.id; o2.textContent = m.name;
      repayToSel.appendChild(o2);
    });
    document.getElementById("repayDate").value = new Date().toISOString().slice(0,10);

    await refreshExpenses();
  }

  document.getElementById("addExpenseBtn").addEventListener("click", async ()=>{
    const amount = Number(document.getElementById("expAmount").value);
    const description = document.getElementById("expDesc").value.trim();
    const paid_by = document.getElementById("expPaidBy").value;
    const expense_date = document.getElementById("expDate").value;
    const participants = Array.from(document.querySelectorAll("#expParticipants input:checked")).map(i=>i.value);
    const msg = document.getElementById("expMsg");

    if(!amount || amount <= 0){ msg.textContent = "請輸入正確金額"; msg.className = "msg error"; return; }
    if(!description){ msg.textContent = "請輸入項目說明"; msg.className = "msg error"; return; }
    if(!participants.length){ msg.textContent = "至少要選一個人分攤"; msg.className = "msg error"; return; }

    const { error } = await sb.from("expenses").insert({
      amount, description, paid_by, participants, expense_date
    });
    if(error){ msg.textContent = "新增失敗：" + error.message; msg.className = "msg error"; return; }

    msg.textContent = "已加入！"; msg.className = "msg ok";
    document.getElementById("expAmount").value = "";
    document.getElementById("expDesc").value = "";
    setTimeout(()=>{ msg.textContent = ""; }, 1500);
    await refreshExpenses();
  });

  document.getElementById("addRepaymentBtn").addEventListener("click", async ()=>{
    const from_member = document.getElementById("repayFrom").value;
    const to_member = document.getElementById("repayTo").value;
    const amount = Number(document.getElementById("repayAmount").value);
    const note = document.getElementById("repayNote").value.trim();
    const payment_date = document.getElementById("repayDate").value;
    const msg = document.getElementById("repayMsg");

    if(from_member === to_member){ msg.textContent = "付錢跟收錢不能是同一個人"; msg.className = "msg error"; return; }
    if(!amount || amount <= 0){ msg.textContent = "請輸入正確金額"; msg.className = "msg error"; return; }

    const { error } = await sb.from("repayments").insert({
      from_member, to_member, amount, note: note || null, payment_date
    });
    if(error){ msg.textContent = "新增失敗：" + error.message; msg.className = "msg error"; return; }

    msg.textContent = "已記錄還款！"; msg.className = "msg ok";
    document.getElementById("repayAmount").value = "";
    document.getElementById("repayNote").value = "";
    setTimeout(()=>{ msg.textContent = ""; }, 1500);
    await refreshExpenses();
  });

  async function refreshExpenses(){
    const { data: expenses } = await sb.from("expenses")
      .select("*")
      .order("expense_date", { ascending:false })
      .order("created_at", { ascending:false });
    const { data: repayments } = await sb.from("repayments")
      .select("*")
      .order("payment_date", { ascending:false })
      .order("created_at", { ascending:false });

    renderHistory(expenses || []);
    renderRepaymentHistory(repayments || []);
    renderBalances(expenses || [], repayments || []);
  }

  function renderHistory(expenses){
    const el = document.getElementById("expenseHistory");
    if(!expenses.length){
      el.innerHTML = '<div class="settle-empty">還沒有任何支出紀錄</div>';
      return;
    }
    el.innerHTML = expenses.map(e=>{
      const canDelete = e.paid_by === currentUser.id;
      const names = e.participants.map(id => memberById[id] || "?").join("、");
      return `<div class="exp-item">
        <div class="exp-main">
          <div class="exp-desc">${escapeHtml(e.description)}</div>
          <div class="exp-meta">${e.expense_date} ・ ${memberById[e.paid_by] || "?"} 付的 ・ 分攤：${names}</div>
        </div>
        <div class="exp-amt">¥${Number(e.amount).toLocaleString()}</div>
        ${canDelete ? `<button class="exp-del" data-id="${e.id}" title="刪除">✕</button>` : ""}
      </div>`;
    }).join("");
    el.querySelectorAll(".exp-del").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(!confirm("確定要刪除這筆紀錄嗎？")) return;
        await sb.from("expenses").delete().eq("id", btn.dataset.id);
        await refreshExpenses();
      });
    });
  }

  function renderRepaymentHistory(repayments){
    const el = document.getElementById("repaymentHistory");
    if(!repayments.length){
      el.innerHTML = '<div class="settle-empty">還沒有任何還款紀錄</div>';
      return;
    }
    el.innerHTML = repayments.map(r=>{
      const canDelete = r.from_member === currentUser.id;
      return `<div class="exp-item">
        <div class="exp-main">
          <div class="exp-desc">${memberById[r.from_member] || "?"} → ${memberById[r.to_member] || "?"}</div>
          <div class="exp-meta">${r.payment_date}${r.note ? " ・ " + escapeHtml(r.note) : ""}</div>
        </div>
        <div class="exp-amt">¥${Number(r.amount).toLocaleString()}</div>
        ${canDelete ? `<button class="exp-del" data-id="${r.id}" title="刪除">✕</button>` : ""}
      </div>`;
    }).join("");
    el.querySelectorAll(".exp-del").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(!confirm("確定要刪除這筆還款紀錄嗎？")) return;
        await sb.from("repayments").delete().eq("id", btn.dataset.id);
        await refreshExpenses();
      });
    });
  }

  function renderBalances(expenses, repayments){
    const balance = {};
    memberRows.forEach(m => balance[m.id] = 0);
    expenses.forEach(e=>{
      const share = e.amount / e.participants.length;
      balance[e.paid_by] = (balance[e.paid_by] || 0) + Number(e.amount);
      e.participants.forEach(pid=>{ balance[pid] = (balance[pid] || 0) - share; });
    });
    // a repayment settles debt: the payer's balance moves up (less owed),
    // the receiver's balance moves down (they've now been paid back)
    repayments.forEach(r=>{
      balance[r.from_member] = (balance[r.from_member] || 0) + Number(r.amount);
      balance[r.to_member] = (balance[r.to_member] || 0) - Number(r.amount);
    });
    Object.keys(balance).forEach(k => balance[k] = Math.round(balance[k] * 10) / 10);

    const balEl = document.getElementById("balanceList");
    balEl.innerHTML = memberRows.map(m=>{
      const amt = balance[m.id] || 0;
      const cls = amt > 0.05 ? "pos" : amt < -0.05 ? "neg" : "zero";
      const label = amt > 0.05 ? `該收 ¥${amt.toLocaleString()}` : amt < -0.05 ? `該付 ¥${Math.abs(amt).toLocaleString()}` : "已結清";
      return `<div class="balance-row"><span>${m.name}</span><span class="amt ${cls}">${label}</span></div>`;
    }).join("");

    const myAmt = balance[currentUser.id] || 0;
    const myCls = myAmt > 0.05 ? "pos" : myAmt < -0.05 ? "neg" : "zero";
    const myLabel = myAmt > 0.05 ? `該收 ¥${myAmt.toLocaleString()}` : myAmt < -0.05 ? `該付 ¥${Math.abs(myAmt).toLocaleString()}` : "已結清 🎉";
    const myBalanceAmtEl = document.getElementById("myBalanceAmt");
    myBalanceAmtEl.textContent = myLabel;
    myBalanceAmtEl.className = "my-balance-amt " + myCls;

    renderSettlement(balance);
  }

  function renderSettlement(balance){
    const creditors = [], debtors = [];
    Object.entries(balance).forEach(([id, amt])=>{
      if(amt > 0.05) creditors.push({ id, amt });
      else if(amt < -0.05) debtors.push({ id, amt: -amt });
    });
    creditors.sort((a,b)=> b.amt - a.amt);
    debtors.sort((a,b)=> b.amt - a.amt);

    const tx = [];
    let ci = 0, di = 0;
    while(ci < creditors.length && di < debtors.length){
      const c = creditors[ci], d = debtors[di];
      const amt = Math.round(Math.min(c.amt, d.amt) * 10) / 10;
      if(amt > 0.05) tx.push({ from:d.id, to:c.id, amt });
      c.amt -= amt; d.amt -= amt;
      if(c.amt <= 0.05) ci++;
      if(d.amt <= 0.05) di++;
    }

    const el = document.getElementById("settleList");
    if(!tx.length){
      el.innerHTML = '<div class="settle-empty">目前帳務已經平衡，不用轉帳給任何人 🎉</div>';
      return;
    }
    el.innerHTML = tx.map((t,i)=>`
      <div class="settle-item settle-clickable" data-from="${t.from}" data-to="${t.to}" data-amt="${t.amt}">
        <b>${memberById[t.from]}</b><span class="arrow">→</span><b>${memberById[t.to]}</b>
        <span class="amt">¥${t.amt.toLocaleString()}</span>
      </div>`).join("");
    el.querySelectorAll(".settle-clickable").forEach(row=>{
      row.addEventListener("click", ()=>{
        document.getElementById("repayFrom").value = row.dataset.from;
        document.getElementById("repayTo").value = row.dataset.to;
        document.getElementById("repayAmount").value = row.dataset.amt;
        document.getElementById("repayAmount").scrollIntoView({ behavior:"smooth", block:"center" });
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- boot: check for an existing session ----------
  (async function boot(){
    const { data:{ session } } = await sb.auth.getSession();
    if(session && session.user){
      await onLoggedIn(session.user);
    } else {
      loginScreen.style.display = "block";
    }
  })();
})();
</script>
</body>
</html>
