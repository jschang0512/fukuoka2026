<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try{
    var t = localStorage.getItem("kyushu-theme");
    if(t !== "dark" && t !== "light"){
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅費分帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Sans+TC:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js" defer></script>
<style>
  /* ============================================================
     設定區：換成你自己 Supabase 專案的 URL 跟 anon public key
     （Supabase Dashboard → Project Settings → API）
     成員清單的 email 要跟你在 Supabase Auth 建立帳號時用的一致
     ============================================================ */
  body{ background:var(--paper); }
  .wrap{ max-width:560px; margin:0 auto; padding:24px 16px 60px; }
  .app-header{
    text-align:center;
    padding:26px 16px 20px;
    margin-bottom:20px;
  }
  .app-header .eyebrow{
    font-family:"JetBrains Mono",monospace;
    font-size:11px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .app-header h1{
    font-family:"Shippori Mincho",serif;
    font-size:28px;
    margin:0;
    color:var(--ink);
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(36,32,36,.06);
    transition:box-shadow .2s ease;
  }
  .card:hover{ box-shadow:0 4px 14px rgba(36,32,34,.1); }
  .card h2{
    font-family:"Shippori Mincho",serif;
    font-size:16px;
    margin:0 0 14px;
    color:var(--ink);
  }
  label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:12px 0 5px;
    font-weight:700;
  }
  label:first-of-type{ margin-top:0; }
  select, input[type=text], input[type=password], input[type=number], input[type=date]{
    width:100%;
    font-family:"Noto Sans TC",sans-serif;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    color:var(--ink);
    box-sizing:border-box;
  }
  select:focus, input:focus{ outline:none; border-color:var(--accent); }
  .checks{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:4px; }
  .check-pill{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    min-width:0;
    overflow:hidden;
    box-sizing:border-box;
    height:38px;
    margin:0;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:999px;
    padding:0 6px;
    font-size:12.5px;
    cursor:pointer;
    user-select:none;
    transition:transform .1s ease, border-color .15s ease, background .15s ease;
  }
  .check-pill:active{ transform:scale(.96); }
  .check-pill.sb-bounce{ animation:sbCheckBounce .35s ease; }
  @keyframes sbCheckBounce{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.06); }
    100%{ transform:scale(1); }
  }
  .check-pill-name{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .check-pill input{ width:auto; flex:0 0 auto; accent-color:#7A6B9E; }
  .check-pill.checked{ border-color:#7A6B9E; background:#EDEAF5; }
  :root[data-theme="dark"] .check-pill.checked{ background:#2A2A2A; }

  .amt-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-top:4px; }
  .amt-row{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
    overflow:hidden;
    box-sizing:border-box;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px 8px;
  }
  .amt-row-name{ flex:0 0 auto; font-size:12px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:64px; }
  .amt-row-input{
    flex:1;
    min-width:0;
    width:auto;
    border:none;
    background:none;
    padding:2px 0;
    font-size:13px;
    text-align:right;
  }
  .amt-row-input:focus{ outline:none; }
  .sum-check{ font-size:12px; margin-top:6px; min-height:16px; }
  .split-toggle{ display:inline-flex; gap:4px; margin-left:8px; }
  .split-mode-btn{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px 10px;
    font-size:11px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    font-family:"Noto Sans TC",sans-serif;
  }
  .split-mode-btn.active{ background:#7A6B9E; color:#fff; border-color:#7A6B9E; }

  .btn{
    display:inline-block;
    width:100%;
    text-align:center;
    background:#4A4458;
    color:#FFFFFF;
    border:none;
    font-family:"Noto Sans TC",sans-serif;
    font-size:14px;
    font-weight:700;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    margin-top:16px;
    transition:transform .1s ease, box-shadow .15s ease, background .2s ease;
  }
  .btn:active{ transform:scale(.97); }
  :root[data-theme="dark"] .btn{ background:#B8B0C8; color:#2A2126; }
  .btn:hover{ box-shadow:0 4px 12px rgba(36,32,34,.18); }
  .btn.secondary{
    background:var(--card);
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.small{ width:auto; padding:7px 14px; font-size:12.5px; margin-top:0; }
  .btn:disabled{ opacity:.5; cursor:default; }

  .msg{ font-size:12.5px; margin-top:10px; text-align:center; min-height:0; }
  .msg:not(:empty){ animation:msgIn .2s ease; }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(-3px); } to{ opacity:1; transform:translateY(0); } }
  .msg.error{ color:var(--accent-text); }
  .msg.ok{ color:#2F8F4E; }

  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .topbar .whoami{ flex:1; font-size:13.5px; color:var(--ink-soft); }
  .topbar .whoami b{ color:var(--ink); }

  .exp-item{
    display:flex;
    gap:10px;
    padding:12px 0;
    border-top:1px solid var(--line);
    animation:rowIn .25s ease;
  }
  @keyframes rowIn{ from{ opacity:0; } to{ opacity:1; } }
  .exp-item:first-child{ border-top:none; }
  .exp-item .exp-main{ flex:1; min-width:0; }
  .exp-item .exp-desc{ font-size:14px; font-weight:700; color:var(--ink); }
  .exp-item .exp-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; line-height:1.7; }
  .exp-meta-line{ display:block; }
  .exp-item .exp-amt{ flex:0 0 auto; font-family:"JetBrains Mono",monospace; font-weight:700; color:var(--accent-text); font-size:15px; }
  .exp-edit{ flex:0 0 auto; background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px; padding:0 2px; transition:transform .1s ease, color .15s ease; }
  .exp-edit:hover{ color:#7A6B9E; }
  .exp-edit:active{ transform:scale(.85); }
  .exp-del{ flex:0 0 auto; background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:0 2px; transition:transform .1s ease, color .15s ease; }
  .exp-del:hover{ color:#C2445F; }
  .exp-del:active{ transform:scale(.85); }

  .balance-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 0;
    border-top:1px solid var(--line);
    font-size:13.5px;
  }
  .balance-row:first-child{ border-top:none; }
  .balance-row .amt{ text-align:right; }
  .balance-row .amt.pos{ color:#2F8F4E; font-weight:700; font-family:"JetBrains Mono",monospace; }
  .balance-row .amt.neg{ color:#C2445F; font-weight:700; font-family:"JetBrains Mono",monospace; }
  .balance-row .amt.zero{ color:var(--ink-soft); font-family:"JetBrains Mono",monospace; }

  .settle-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    background:var(--paper);
    border-radius:10px;
    margin-bottom:8px;
    font-size:13.5px;
  }
  .settle-clickable{ cursor:pointer; border:1px solid transparent; transition:border-color .15s ease, transform .1s ease; }
  .settle-clickable:hover{ border-color:var(--accent); }
  .settle-clickable:active{ transform:scale(.98); }
  .settle-item b{ color:var(--ink); }
  .settle-item .arrow{ color:var(--ink-soft); }
  .settle-item .amt{ margin-left:auto; text-align:right; font-family:"JetBrains Mono",monospace; font-weight:700; color:var(--accent-text); }
  .settle-empty{ font-size:13px; color:var(--ink-soft); text-align:center; padding:10px 0; }

  #loginScreen{ display:none; }
  #loginScreen.sb-fade-out{ animation:sbFadeOut .25s ease forwards; }
  @keyframes sbFadeOut{ to{ opacity:0; transform:translateY(-8px); } }
  #appScreen.sb-fade-in{ animation:sbFadeIn .35s ease; }
  @keyframes sbFadeIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  .my-balance{
    position:sticky;
    top:8px;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--ink-soft);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:14px;
    box-shadow:0 4px 14px rgba(36,32,34,.15);
    transition:background .2s ease;
  }
  .my-balance.pos{ background:#2F8F4E; }
  .my-balance.neg{ background:#C2445F; }
  .my-balance.zero{ background:#5C5C68; }
  .my-balance-label{ font-size:12px; color:rgba(255,255,255,.85); }
  .sb-confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:300;
    overflow:hidden;
  }
  .sb-confetti span{
    position:absolute;
    top:20%;
    width:8px; height:8px;
    border-radius:2px;
    opacity:0;
    animation:sbConfettiBurst 1.3s ease-out forwards;
  }
  @keyframes sbConfettiBurst{
    0%{ opacity:1; transform:translate(0,0) rotate(0deg); }
    100%{ opacity:0; transform:translate(var(--dx), 220px) rotate(var(--rot)); }
  }

  .my-balance-amt{
    font-family:"JetBrains Mono",monospace;
    font-size:20px;
    font-weight:700;
    color:#FFFFFF;
  }
  .my-balance-amt .twd-hint{ color:rgba(255,255,255,.8); }
  .my-balance.pulse{ animation:balancePulse .4s ease; }
  @keyframes balancePulse{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.015); }
    100%{ transform:scale(1); }
  }

  .app-tabs{
    display:flex;
    gap:6px;
    margin-bottom:16px;
  }
  .app-tab{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 6px;
    font-family:"Noto Sans TC",sans-serif;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .app-tab.active{
    background:#7A6B9E;
    color:#FFFFFF;
    border-color:#7A6B9E;
  }
  .app-panel{ display:none; }
  .app-panel.active{ display:block; animation:panelIn .25s ease; }
  @keyframes panelIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .twd-hint{
    display:block;
    font-size:10px;
    font-weight:400;
    color:var(--ink-soft);
    font-family:"Noto Sans TC",sans-serif;
    margin-top:1px;
  }
  #appScreen{ display:none; }
  .hidden{ display:none !important; }

  .link-btn{ background:none; border:none; color:var(--accent-text); font-size:12.5px; cursor:pointer; text-decoration:underline; padding:0; }
  .edit-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#F5EEF0;
    border-radius:10px;
    padding:8px 12px;
    margin-bottom:14px;
    font-size:12.5px;
    color:#7A6B9E;
    font-weight:700;
  }
  :root[data-theme="dark"] .edit-banner{ background:#2A2A2A; }
  .print-only{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printSummary, #printSummary *{ visibility:visible; }
    #printSummary{
      display:block;
      position:absolute;
      top:0; left:0; width:100%;
      padding:20px;
      color:#111;
      background:#fff;
    }
    #printSummary h1{ font-family:"Shippori Mincho",serif; font-size:22px; margin:0 0 4px; }
    #printSummary .print-date{ font-size:12px; color:#666; margin-bottom:20px; }
    #printSummary h2{ font-size:15px; margin:20px 0 8px; border-bottom:1px solid #ccc; padding-bottom:4px; }
    #printSummary .print-row{ display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid #eee; }
    #printSummary .print-row b{ font-weight:700; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="app-header">
    <div class="eyebrow">SPLIT BILL</div>
    <h1>旅費分帳</h1>
    <a href="kyushu_itinerary.html" style="display:inline-block; margin-top:8px; font-size:12px; color:var(--ink-soft);">← 回到行程表</a>
  </div>

  <!-- 設定不完整時顯示 -->
  <div id="configWarning" class="card hidden">
    <h2>⚠️ 尚未設定 Supabase</h2>
    <p style="font-size:13px; color:var(--ink-soft); line-height:1.7;">
      打開這個檔案，把最下面 <code>&lt;script&gt;</code> 區塊裡的
      <code>SUPABASE_URL</code> 跟 <code>SUPABASE_ANON_KEY</code>
      換成你自己 Supabase 專案的值，存檔後重新整理即可。
    </p>
  </div>

  <!-- 登入畫面 -->
  <div id="loginScreen" class="card">
    <h2>🔒 登入</h2>
    <label>選擇你的名字</label>
    <select id="loginName"></select>
    <label>密碼<span style="font-weight:400;color:var(--ink-soft);">（預設是生日 8 碼，例如 20031231）</span></label>
    <input type="password" id="loginPassword" placeholder="輸入密碼">
    <button class="btn" id="loginBtn">登入</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- 主畫面 -->
  <div id="appScreen">
    <div class="topbar">
      <div class="whoami">登入身份：<b id="whoamiName"></b></div>
      <button class="btn secondary small" id="changePwBtn">變更密碼</button>
      <button class="btn secondary small" id="logoutBtn">登出</button>
    </div>

    <!-- 變更密碼 -->
    <div class="card hidden" id="changePwCard">
      <h2>🔑 變更密碼</h2>
      <label>新密碼（至少 6 碼）</label>
      <input type="password" id="newPassword">
      <button class="btn" id="savePwBtn">儲存新密碼</button>
      <button class="link-btn" id="cancelPwBtn" style="margin-top:10px;">取消</button>
      <div class="msg" id="pwMsg"></div>
    </div>

    <!-- 固定顯示：我目前該收/該付多少錢 -->
    <div class="my-balance" id="myBalance">
      <div class="my-balance-label">我的餘額</div>
      <div class="my-balance-amt" id="myBalanceAmt">—</div>
    </div>

    <!-- 分頁籤 -->
    <div class="app-tabs">
      <button type="button" class="app-tab active" data-tab="expense">🧾 支出</button>
      <button type="button" class="app-tab" data-tab="repay">💸 還款</button>
      <button type="button" class="app-tab" data-tab="history">📋 記錄</button>
      <button type="button" class="app-tab" data-tab="summary">📊 總表</button>
    </div>

    <!-- 支出 -->
    <div class="app-panel active" id="panelExpense">
      <div class="card">
        <h2 id="expFormTitle">🧾 新增支出</h2>
        <div class="edit-banner hidden" id="editBanner">
          ✎ 編輯模式 <button type="button" class="link-btn" id="cancelEditBtn">取消編輯</button>
        </div>
        <label>總金額（日圓）</label>
        <input type="number" id="expAmount" placeholder="例如 3200" min="1" step="1">
        <label>項目說明</label>
        <input type="text" id="expDesc" placeholder="例如 博多晚餐、租車油錢">

        <label>
          誰付的錢
          <span class="split-toggle">
            <button type="button" class="split-mode-btn active" data-payer-mode="single">單人全付</button>
            <button type="button" class="split-mode-btn" data-payer-mode="multi">多人付款</button>
          </span>
        </label>
        <select id="expPaidBySingle"></select>
        <div class="amt-grid hidden" id="expPayers"></div>
        <div class="sum-check" id="payerSumCheck"></div>

        <label>
          怎麼分攤
          <span class="split-toggle">
            <button type="button" class="split-mode-btn active" data-mode="equal">平均分攤</button>
            <button type="button" class="split-mode-btn" data-mode="custom">自訂金額</button>
          </span>
        </label>
        <div class="checks" id="expParticipants"></div>
        <div class="amt-grid hidden" id="expSharesCustom"></div>
        <div class="sum-check" id="shareSumCheck"></div>

        <label>日期</label>
        <input type="date" id="expDate">
        <button class="btn" id="addExpenseBtn">加入這筆支出</button>
        <div class="msg" id="expMsg"></div>
      </div>
    </div>

    <!-- 還款 -->
    <div class="app-panel" id="panelRepay">
      <div class="card">
        <h2>🤝 建議還款方式</h2>
        <div id="settleList"></div>
        <p style="font-size:11.5px; color:var(--ink-soft); margin:10px 0 0;">點下面某一筆會自動幫你填好下面的還款表單</p>
      </div>
      <div class="card">
        <h2>💸 記錄還款</h2>
        <label>誰還錢</label>
        <select id="repayFrom"></select>
        <label>誰收錢</label>
        <select id="repayTo"></select>
        <label>金額（日圓）</label>
        <input type="number" id="repayAmount" placeholder="例如 1500" min="1" step="1">
        <label>備註（選填）</label>
        <input type="text" id="repayNote" placeholder="例如 現金當面給、轉帳">
        <label>日期</label>
        <input type="date" id="repayDate">
        <button class="btn" id="addRepaymentBtn">記錄這筆還款</button>
        <div class="msg" id="repayMsg"></div>
      </div>
    </div>

    <!-- 記錄 -->
    <div class="app-panel" id="panelHistory">
      <div class="card">
        <h2>📋 支出紀錄</h2>
        <div id="expenseHistory"></div>
      </div>
      <div class="card">
        <h2>💵 還款紀錄</h2>
        <div id="repaymentHistory"></div>
      </div>
    </div>

    <!-- 總表 -->
    <div class="app-panel" id="panelSummary">
      <div class="card">
        <h2>💰 目前餘額</h2>
        <div id="balanceList"></div>
        <button type="button" class="btn secondary" id="printSummaryBtn">🖨 列印／匯出總表</button>
      </div>
    </div>
  </div>
</div>

<div id="printSummary" class="print-only"></div>

<script>
/* ============================================================
   設定：換成你自己 Supabase 專案的值
   （Supabase Dashboard → Project Settings → API 可以找到）
   ============================================================ */

const SUPABASE_ANON_KEY = "sb_publishable_pWT6foelsonrb1sLMXhnCw_oA3ytvaX";

  { name:"蕭名燁", email:"mingye@kyushu-trip.local" },

<script>
(function(){
  if(SUPABASE_URL.startsWith("YOUR_") || SUPABASE_ANON_KEY.startsWith("YOUR_")){
    document.getElementById("configWarning").classList.remove("hidden");
    return;
  }

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;      // supabase auth user object

  // JPY→TWD rate, fetched once — free & keyless, same sources used on the
  // main itinerary site (ExchangeRate-API first, two fallbacks after that)
  let jpyToTwdRate = null;
  function fetchForexRate(){
    const sources = [
      { url:"https://open.er-api.com/v6/latest/JPY", parse:d => d && d.rates && d.rates.TWD },
      { url:"https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json", parse:d => d && d.jpy && d.jpy.twd },
      { url:"https://latest.currency-api.pages.dev/v1/currencies/jpy.json", parse:d => d && d.jpy && d.jpy.twd }
    ];
    function tryFetch(i){
      if(i >= sources.length) return;
      fetch(sources[i].url)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
          const rate = sources[i].parse(data);
          if(!rate) throw new Error("no rate");
          jpyToTwdRate = rate;
          if(currentUser) refreshExpenses(); // re-render so TWD hints appear retroactively
        })
        .catch(()=> tryFetch(i+1));
    }
    tryFetch(0);
  }
  fetchForexRate();

    if(!jpyToTwdRate) return "";

    return `<span class="twd-hint">≈NT$${Number(twd).toLocaleString()}</span>`;
  }

  function sumCheckHTML(total, sum){
    const diff = Math.round((total - sum) * 100) / 100;
    if(!total) return "";
    if(Math.abs(diff) < 0.5) return `<span style="color:#2F8F4E;">✓ 已分配 ¥${sum.toLocaleString()}</span>`;
    if(diff > 0) return `<span style="color:#C2445F;">還差 ¥${diff.toLocaleString()} 未分配（目前 ¥${sum.toLocaleString()} / ¥${total.toLocaleString()}）</span>`;
    return `<span style="color:#C2445F;">超過總金額 ¥${Math.abs(diff).toLocaleString()}（目前 ¥${sum.toLocaleString()} / ¥${total.toLocaleString()}）</span>`;
  }

  function readAmountRows(containerId){

  document.getElementById("addExpenseBtn").addEventListener("click", async ()=>{
    const amount = Number(document.getElementById("expAmount").value);
    const description = document.getElementById("expDesc").value.trim();
    const expense_date = document.getElementById("expDate").value;
    const msg = document.getElementById("expMsg");

    if(!amount || amount <= 0){ msg.textContent = "請輸入正確金額"; msg.className = "msg error"; return; }
    if(!description){ msg.textContent = "請輸入項目說明"; msg.className = "msg error"; return; }

    // payers — single payer (default) gets the full amount automatically,
    // no allocation check needed since it's always exactly the total;
    // multi-payer mode requires the amounts to sum to the total
    let payers;
    if(payerMode === "single"){
      payers = [{ member_id: document.getElementById("expPaidBySingle").value, amount }];
    } else {
      payers = readAmountRows("expPayers");
      if(!payers.length){ msg.textContent = "至少要有一個人付錢"; msg.className = "msg error"; return; }
      const payerSum = payers.reduce((s,p)=>s+p.amount, 0);
      if(Math.abs(payerSum - amount) >= 0.5){
        const diff = Math.round((amount - payerSum) * 100) / 100;
        msg.textContent = diff > 0
          ? `付款總額還差 ¥${diff.toLocaleString()}，跟支出金額 ¥${amount.toLocaleString()} 對不上，無法加入`
          : `付款總額超過 ¥${Math.abs(diff).toLocaleString()}，跟支出金額 ¥${amount.toLocaleString()} 對不上，無法加入`;
        msg.className = "msg error";
        return;
      }
    }

    // shares — equal split from checkboxes, or custom amounts, must also sum to the total
    let shares = [];
    if(splitMode === "equal"){
      const participants = Array.from(document.querySelectorAll("#expParticipants input:checked")).map(i=>i.value);
      if(!participants.length){ msg.textContent = "至少要選一個人分攤"; msg.className = "msg error"; return; }
      const each = Math.round((amount / participants.length) * 100) / 100;
      shares = participants.map(id => ({ member_id: id, amount: each }));
      // put any rounding remainder onto the first participant so the total matches exactly
      const roundedSum = each * participants.length;
      const remainder = Math.round((amount - roundedSum) * 100) / 100;
      if(remainder !== 0) shares[0].amount = Math.round((shares[0].amount + remainder) * 100) / 100;
    } else {
      shares = readAmountRows("expSharesCustom");
      if(!shares.length){ msg.textContent = "至少要有一個人分攤"; msg.className = "msg error"; return; }
      const shareSum = shares.reduce((s,p)=>s+p.amount, 0);
      if(Math.abs(shareSum - amount) >= 0.5){
        const diff = Math.round((amount - shareSum) * 100) / 100;
        msg.textContent = diff > 0
          ? `分攤總額還差 ¥${diff.toLocaleString()}，跟支出金額 ¥${amount.toLocaleString()} 對不上，無法加入`
          : `分攤總額超過 ¥${Math.abs(diff).toLocaleString()}，跟支出金額 ¥${amount.toLocaleString()} 對不上，無法加入`;
        msg.className = "msg error";
        return;
      }
    }

    const payload = { amount, description, expense_date, created_by: currentUser.id, payers, shares };
    const { error } = editingExpenseId
      ? await sb.from("expenses").update(payload).eq("id", editingExpenseId)
      : await sb.from("expenses").insert(payload);
    if(error){ msg.textContent = (editingExpenseId ? "更新失敗：" : "新增失敗：") + error.message; msg.className = "msg error"; return; }

    msg.textContent = editingExpenseId ? "已更新！" : "已加入！";
    msg.className = "msg ok";
    const wasEditing = !!editingExpenseId;

    document.getElementById("expAmount").value = "";
    document.getElementById("expDesc").value = "";
    document.querySelectorAll("#expPayers .amt-row-input, #expSharesCustom .amt-row-input").forEach(i=>i.value="");
    document.getElementById("payerSumCheck").innerHTML = "";
    document.getElementById("shareSumCheck").innerHTML = "";
    setTimeout(()=>{ msg.textContent = ""; }, 1500);
    await refreshExpenses();
  });

  async function refreshExpenses(){
    const { data: expenses } = await sb.from("expenses")
      .select("*")
      .order("expense_date", { ascending:false })
      .order("created_at", { ascending:false });
    const { data: repayments } = await sb.from("repayments")
      .select("*")
      .order("payment_date", { ascending:false })
      .order("created_at", { ascending:false });

    renderHistory(expenses || []);
    renderRepaymentHistory(repayments || []);
    renderBalances(expenses || [], repayments || []);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function formatTime(createdAt, entryDate){
    if(!createdAt) return "";
    const today = new Date().toISOString().slice(0,10);
    if(entryDate !== today) return ""; // backdated entry — the "entered at" time isn't meaningful here
    const d = new Date(createdAt);
    if(isNaN(d.getTime())) return "";
    return d.toLocaleTimeString("zh-TW", { hour:"2-digit", minute:"2-digit", hour12:false });
  }

      return `<div class="exp-item">
        <div class="exp-main">

  // confetti burst — celebrates reaching "已結清" (settled up)
  function fireConfetti(){
    const colors = ["#C2445F","#7A6B9E","#2F8F4E","#F5C2CE"];
    const container = document.createElement("div");
    container.className = "sb-confetti";
    for(let i=0;i<26;i++){
      const bit = document.createElement("span");
      bit.style.left = (45 + Math.random()*10) + "%";
      bit.style.background = colors[i % colors.length];
      bit.style.animationDelay = (Math.random()*0.15) + "s";
      bit.style.setProperty("--dx", (Math.random()*220-110) + "px");
      bit.style.setProperty("--rot", (Math.random()*520-260) + "deg");
      container.appendChild(bit);
    }
    document.body.appendChild(container);
    setTimeout(()=>{ container.remove(); }, 1600);
  }
  let lastBalanceCls = null; // tracks the previous state so confetti only fires on pos/neg → zero transitions
  let lastBalance = {}; // cached for the print-summary button

  // animates a displayed ¥ figure counting from its previous value to the new one
  function animateAmount(el, from, to, formatFn){
    const duration = 450;
    const start = performance.now();
    function tick(now){
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const current = from + (to - from) * eased;
      el.textContent = formatFn(current);
      if(t < 1) requestAnimationFrame(tick);
      else el.textContent = formatFn(to);
    }
    requestAnimationFrame(tick);
  }

  function renderBalances(expenses, repayments){
    const balance = {};
    memberRows.forEach(m => balance[m.id] = 0);
    expenses.forEach(e=>{
      (e.payers || []).forEach(p=>{ balance[p.member_id] = (balance[p.member_id] || 0) + Number(p.amount); });
      (e.shares || []).forEach(s=>{ balance[s.member_id] = (balance[s.member_id] || 0) - Number(s.amount); });
    });
    // a repayment settles debt: the payer's balance moves up (less owed),
    // the receiver's balance moves down (they've now been paid back)
    repayments.forEach(r=>{
      balance[r.from_member] = (balance[r.from_member] || 0) + Number(r.amount);
      balance[r.to_member] = (balance[r.to_member] || 0) - Number(r.amount);
    });
    Object.keys(balance).forEach(k => balance[k] = Math.round(balance[k] * 10) / 10);

    const balEl = document.getElementById("balanceList");
    balEl.innerHTML = memberRows.map(m=>{
      const amt = balance[m.id] || 0;
      const cls = amt > 0.05 ? "pos" : amt < -0.05 ? "neg" : "zero";
      const label = amt > 0.05 ? `該收 ¥${amt.toLocaleString()}${twdHint(amt)}` : amt < -0.05 ? `該付 ¥${Math.abs(amt).toLocaleString()}${twdHint(Math.abs(amt))}` : "已結清";
      return `<div class="balance-row"><span>${m.name}</span><span class="amt ${cls}">${label}</span></div>`;
    }).join("");

    const myAmt = balance[currentUser.id] || 0;
    const myCls = myAmt > 0.05 ? "pos" : myAmt < -0.05 ? "neg" : "zero";
    const myAbs = Math.abs(myAmt);
    const myBalanceAmtEl = document.getElementById("myBalanceAmt");
    const prevAbs = Number(myBalanceAmtEl.dataset.rawAmt) || 0;

    if(myCls === "zero"){
      myBalanceAmtEl.innerHTML = "已結清 🎉";
      myBalanceAmtEl.dataset.rawAmt = "0";
    } else {
      const statusText = myCls === "pos" ? "該收" : "該付";
      myBalanceAmtEl.innerHTML = `${statusText} ¥<span class="my-balance-num"></span>${twdHint(myAbs)}`;
      const numEl = myBalanceAmtEl.querySelector(".my-balance-num");
      animateAmount(numEl, prevAbs, myAbs, v => Math.round(v).toLocaleString());
      myBalanceAmtEl.dataset.rawAmt = String(myAbs);
    }
    myBalanceAmtEl.className = "my-balance-amt " + myCls;

    const myBalanceEl = document.getElementById("myBalance");
    myBalanceEl.className = "my-balance " + myCls;
    void myBalanceEl.offsetWidth;
    myBalanceEl.classList.add("pulse");

    if(myCls === "zero" && lastBalanceCls !== null && lastBalanceCls !== "zero"){
      fireConfetti(); // only celebrate the moment it *becomes* settled, not every re-render while already settled
    }
    lastBalanceCls = myCls;

    lastBalance = balance;
    renderSettlement(balance);
  }

  function computeSettlementTx(balance){
    const creditors = [], debtors = [];
    Object.entries(balance).forEach(([id, amt])=>{
      if(amt > 0.05) creditors.push({ id, amt });
      else if(amt < -0.05) debtors.push({ id, amt: -amt });
    });
    creditors.sort((a,b)=> b.amt - a.amt);
    debtors.sort((a,b)=> b.amt - a.amt);

    const tx = [];
    let ci = 0, di = 0;
    while(ci < creditors.length && di < debtors.length){
      const c = creditors[ci], d = debtors[di];
      const amt = Math.round(Math.min(c.amt, d.amt) * 10) / 10;
      if(amt > 0.05) tx.push({ from:d.id, to:c.id, amt });
      c.amt -= amt; d.amt -= amt;
      if(c.amt <= 0.05) ci++;
      if(d.amt <= 0.05) di++;
    }
    return tx;
  }

  function renderSettlement(balance){
    const tx = computeSettlementTx(balance);
    const el = document.getElementById("settleList");
    if(!tx.length){
      el.innerHTML = '<div class="settle-empty">目前帳務已經平衡，不用轉帳給任何人 🎉</div>';
      return;
    }
    el.innerHTML = tx.map((t,i)=>`
      <div class="settle-item settle-clickable" data-from="${t.from}" data-to="${t.to}" data-amt="${t.amt}">
        <b>${memberById[t.from]}</b><span class="arrow">→</span><b>${memberById[t.to]}</b>
        <span class="amt">¥${t.amt.toLocaleString()}${twdHint(t.amt)}</span>
      </div>`).join("");
    el.querySelectorAll(".settle-clickable").forEach(row=>{
      row.addEventListener("click", ()=>{
        document.getElementById("repayFrom").value = row.dataset.from;
        document.getElementById("repayTo").value = row.dataset.to;
        document.getElementById("repayAmount").value = row.dataset.amt;
        document.getElementById("repayAmount").scrollIntoView({ behavior:"smooth", block:"center" });
      });
    });
  }

  document.getElementById("printSummaryBtn").addEventListener("click", ()=>{
    const tx = computeSettlementTx(lastBalance);
    const dateStr = new Date().toLocaleDateString("zh-TW", { year:"numeric", month:"long", day:"numeric" });

    const balanceRows = memberRows.map(m=>{
      const amt = lastBalance[m.id] || 0;
      const label = amt > 0.05 ? `該收 ¥${amt.toLocaleString()}` : amt < -0.05 ? `該付 ¥${Math.abs(amt).toLocaleString()}` : "已結清";
      return `<div class="print-row"><span>${m.name}</span><b>${label}</b></div>`;
    }).join("");

    const settleRows = tx.length
      ? tx.map(t => `<div class="print-row"><span>${memberById[t.from]} → ${memberById[t.to]}</span><b>¥${t.amt.toLocaleString()}</b></div>`).join("")
      : `<div class="print-row"><span>帳務已平衡，不需要轉帳</span></div>`;

    document.getElementById("printSummary").innerHTML = `
      <h1>旅費分帳總表</h1>
      <div class="print-date">列印時間：${dateStr}</div>
      <h2>目前餘額</h2>
      ${balanceRows}
      <h2>建議還款方式</h2>
      ${settleRows}
    `;
    window.print();
  });

  // ---------- boot: check for an existing session ----------
  (async function boot(){
    const { data:{ session } } = await sb.auth.getSession();
    if(session && session.user){
      await onLoggedIn(session.user);
    } else {
      loginScreen.style.display = "block";
    }
  })();
})();
</script>
